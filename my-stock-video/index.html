:root{
  --white:#E8EEF6; --ice:#7FB2E5; --gold:#C8A96A;
  --sans:'InterSub','NotoSCSub','Source Han Sans SC','PingFang SC',sans-serif;
  --serif:'CormorantSub','Times New Roman',serif;
  --mono:'PlexMonoSub',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05070E}
#stage{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(ellipse 120% 100% at 32% 28%,#0B1220 0%,#080D18 45%,#05070E 100%)}
.layer{position:absolute;inset:0}
canvas.layer{width:1920px;height:1080px}
svg.layer{width:1920px;height:1080px;overflow:visible}

/* type — light weights, +0.05em tracking, never bold, never centred posters */
.t{position:absolute;font-family:var(--sans);font-weight:300;letter-spacing:.05em;color:var(--white);
  white-space:nowrap;opacity:0;will-change:transform,opacity,filter}
.gold{color:var(--gold)}
.ice{color:var(--ice)}
.num{font-family:var(--serif);font-weight:300;letter-spacing:.04em}

.cert{position:absolute;opacity:0;transform-origin:0 0}
.cert svg{display:block;width:100%;height:100%;filter:saturate(.55) brightness(.92)}
/* rim light from the distant star (upper-left): edge highlight on the lit sides only */
.cert::after{content:'';position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 1.5px 1.5px 0 rgba(232,238,246,.78),inset 3px 3px 6px -3px rgba(232,238,246,.35),-10px -10px 30px -18px rgba(232,238,246,.45)}

#grain{position:absolute;left:-64px;top:-64px;width:2048px;height:1208px;opacity:.04;pointer-events:none}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 85% 80% at 50% 48%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="haze" class="layer" width="1920" height="1080"></canvas>
  <canvas id="stars" class="layer" width="1920" height="1080"></canvas>
  <svg id="world" class="layer" viewBox="0 0 1920 1080">
    <defs>
      <!-- planet: lit from the upper-left star -->
      <radialGradient id="planetFill" gradientUnits="userSpaceOnUse" cx="420" cy="760" r="2400">
        <stop offset="0" stop-color="#121B2C"/>
        <stop offset=".35" stop-color="#0A101C"/>
        <stop offset="1" stop-color="#05070D"/>
      </radialGradient>
      <linearGradient id="rimGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="0">
        <stop offset="0" stop-color="#E8EEF6" stop-opacity=".95"/>
        <stop offset=".45" stop-color="#E8EEF6" stop-opacity=".55"/>
        <stop offset="1" stop-color="#E8EEF6" stop-opacity=".08"/>
      </linearGradient>
      <linearGradient id="atmoGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="0">
        <stop offset="0" stop-color="#7FB2E5" stop-opacity=".55"/>
        <stop offset=".6" stop-color="#7FB2E5" stop-opacity=".22"/>
        <stop offset="1" stop-color="#7FB2E5" stop-opacity=".04"/>
      </linearGradient>
      <linearGradient id="stringGrad" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="1180" y2="0">
        <stop offset="0" stop-color="#E8EEF6" stop-opacity=".95"/>
        <stop offset="1" stop-color="#E8EEF6" stop-opacity=".45"/>
      </linearGradient>
      <filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="glowLine" x="-5%" y="-400%" width="110%" height="900%"><feGaussianBlur stdDeviation="2.4"/></filter>
    </defs>
    <!-- scene 1: planet limb in the lower quarter -->
    <g id="planet" opacity="0">
      <circle cx="1180" cy="4040" r="3200" fill="url(#planetFill)"/>
      <circle cx="1180" cy="4040" r="3203" fill="none" stroke="url(#atmoGrad)" stroke-width="9" filter="url(#soft)"/>
      <circle cx="1180" cy="4040" r="3200" fill="none" stroke="url(#rimGrad)" stroke-width="1.6"/>
    </g>
    <!-- scene 2: the string -->
    <g id="string" opacity="0">
      <path id="stringGlow" d="" fill="none" stroke="#E8EEF6" stroke-opacity=".35" stroke-width="5" filter="url(#glowLine)"/>
      <path id="stringCore" d="" fill="none" stroke="url(#stringGrad)" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </svg>

  <div id="cert" class="cert"></div>

  <!-- scene 1 -->
  <div id="s1a" class="t" style="left:180px;top:372px;font-size:40px">买股票的时候，你买到的，</div>
  <div id="s1b" class="t" style="left:176px;top:438px;font-size:66px"><span class="gold">到底是什么</span>？</div>
  <!-- scene 2 -->
  <div id="s2a" class="t" style="left:178px;top:470px;font-size:54px">股票 ＝ 公司<span class="gold">所有权</span>的凭证</div>
  <div id="s2b" class="t" style="left:180px;top:640px;font-size:30px;color:rgba(232,238,246,.74)">买一股，就是买下公司的一小片</div>

  <canvas id="grain" width="2048" height="1208"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>
</div>

<script>
'use strict';
/* ============================================================
   Deterministic timeline: every pixel is a function of `frame`.
   No CSS transitions/animations, no Date.now(), no Math.random().
   ============================================================ */
const FPS = 30;
window.TOTAL_FRAMES = 1800;

/* ---------- easing ---------- */
// cubic-bezier(.16,1,.3,1): the one "long-exposure" curve used for every entrance
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = s => ((ax * s + bx) * s + cx) * s, dX = s => (3 * ax * s + 2 * bx) * s + cx;
  const Yf = s => ((ay * s + by) * s + cy) * s;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let s = x;
    for (let i = 0; i < 8; i++) { const e = X(s) - x, d = dX(s); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; s -= e / d; }
    let lo = 0, hi = 1;
    if (Math.abs(X(s) - x) > 1e-5) { s = x; for (let i = 0; i < 30; i++) { (X(s) < x ? lo = s : hi = s); s = (lo + hi) / 2; } }
    return Yf(s);
  };
}
const EXPO = bezier(.16, 1, .3, 1);
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
// progress of an entrance that starts at `s` seconds and lasts `d` seconds (0.8–1.6s by spec)
const enter = (t, s, d, ease = EXPO) => ease(clamp((t - s) / d));
const inScene = (f, a, b) => f >= a && f < b;

/* ---------- seeded PRNG (mulberry32) ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const $ = id => document.getElementById(id);
const W = 1920, H = 1080;
const STAR = { x: 300, y: 158 };           // the distant star: key light for the whole film

/* ---------- haze: very low-contrast dust so black never goes dead ---------- */
function valueNoise(seed, w, h, cell) {
  const R = rng(seed), gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2;
  const g = Array.from({ length: gw * gh }, R);
  const sm = x => x * x * (3 - 2 * x);
  return (x, y) => {
    const gx = x / cell, gy = y / cell, ix = Math.floor(gx), iy = Math.floor(gy), fx = sm(gx - ix), fy = sm(gy - iy);
    const v = (i, j) => g[(iy + j) * gw + ix + i];
    return lerp(lerp(v(0, 0), v(1, 0), fx), lerp(v(0, 1), v(1, 1), fx), fy);
  };
}
(function paintHaze() {
  const c = $('haze'), ctx = c.getContext('2d');
  const w = 480, h = 270, small = document.createElement('canvas'); small.width = w; small.height = h;
  const sx = small.getContext('2d'), img = sx.createImageData(w, h);
  const n1 = valueNoise(11, w, h, 90), n2 = valueNoise(12, w, h, 34), n3 = valueNoise(13, w, h, 12);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    // a faint diagonal dust lane from upper-left (near the star) to lower-right
    const lane = Math.exp(-Math.pow((y - (x * 0.42 + 40)) / 95, 2));
    const n = (n1(x, y) * 0.6 + n2(x, y) * 0.3 + n3(x, y) * 0.1);
    const a = clamp(lane * (n - 0.35) * 1.4) * 0.55;
    const i = (y * w + x) * 4;
    img.data[i] = 24; img.data[i + 1] = 34; img.data[i + 2] = 56; img.data[i + 3] = a * 255;
  }
  sx.putImageData(img, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, W, H);
})();

/* ---------- star field: three parallax depths ---------- */
const STARS = (() => {
  const R = rng(2024), out = [];
  const add = (n, depth, smin, smax, amin, amax) => {
    for (let i = 0; i < n; i++) out.push({
      x: R() * (W + 400), y: R() * H, depth, s: lerp(smin, smax, R() ** 2.2),
      a: lerp(amin, amax, R() ** 1.6), ph: R() * 6.283, tw: 0.015 + R() * 0.03, ice: R() < 0.22,
    });
  };
  add(900, 0.25, 0.35, 0.9, 0.12, 0.55);   // far
  add(260, 0.6, 0.6, 1.3, 0.25, 0.8);      // mid
  add(46, 1.0, 1.0, 1.9, 0.5, 0.95);       // near
  return out;
})();
const starCtx = $('stars').getContext('2d');
function drawStars(f, opt) {
  const ctx = starCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const k = opt.brightness;
  if (k <= 0) return;
  // parallax: the whole field slides left, near stars faster; optional slow pull-back (scene 9)
  const drift = f * 0.11;
  const zoom = opt.zoom || 1;
  for (const s of STARS) {
    let x = ((s.x - drift * s.depth) % (W + 400) + (W + 400)) % (W + 400) - 200;
    let y = s.y;
    if (zoom !== 1) { x = W / 2 + (x - W / 2) * lerp(1, zoom, s.depth); y = H / 2 + (y - H / 2) * lerp(1, zoom, s.depth); }
    if (x < -4 || x > W + 4 || y < -4 || y > H + 4) continue;
    const a = s.a * (0.86 + 0.14 * Math.sin(f * s.tw + s.ph)) * k;
    ctx.fillStyle = s.ice ? `rgba(160,198,236,${a})` : `rgba(232,238,246,${a})`;
    ctx.beginPath(); ctx.arc(x, y, s.s, 0, 6.2832); ctx.fill();
    if (s.depth === 1 && s.s > 1.5) {           // only the brightest near stars get a whisper of halo
      ctx.fillStyle = `rgba(232,238,246,${a * 0.08})`;
      ctx.beginPath(); ctx.arc(x, y, s.s * 4, 0, 6.2832); ctx.fill();
    }
  }
  // the key-light star: small hard core, soft cold bloom, faint anamorphic streak
  const g = ctx.createRadialGradient(STAR.x, STAR.y, 0, STAR.x, STAR.y, 150);
  g.addColorStop(0, `rgba(240,246,255,${0.55 * k})`); g.addColorStop(0.06, `rgba(232,238,246,${0.22 * k})`);
  g.addColorStop(0.35, `rgba(127,178,229,${0.05 * k})`); g.addColorStop(1, 'rgba(127,178,229,0)');
  ctx.fillStyle = g; ctx.fillRect(STAR.x - 150, STAR.y - 150, 300, 300);
  const st = ctx.createLinearGradient(STAR.x - 260, 0, STAR.x + 260, 0);
  st.addColorStop(0, 'rgba(232,238,246,0)'); st.addColorStop(0.5, `rgba(232,238,246,${0.13 * k})`); st.addColorStop(1, 'rgba(232,238,246,0)');
  ctx.fillStyle = st; ctx.fillRect(STAR.x - 260, STAR.y - 0.6, 520, 1.2);
  ctx.fillStyle = `rgba(255,255,255,${0.95 * k})`; ctx.beginPath(); ctx.arc(STAR.x, STAR.y, 1.9, 0, 6.2832); ctx.fill();
}

/* ---------- film grain: 4 seeded plates, cycled + offset per frame ---------- */
const GRAIN = Array.from({ length: 4 }, (_, n) => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), img = x.createImageData(256, 256), R = rng(900 + n);
  for (let i = 0; i < img.data.length; i += 4) { const v = R() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  x.putImageData(img, 0, 0); return c;
});
const grainCtx = $('grain').getContext('2d');
function drawGrain(f) {
  const pat = grainCtx.createPattern(GRAIN[f % 4], 'repeat');
  grainCtx.setTransform(1, 0, 0, 1, 0, 0);
  grainCtx.fillStyle = pat; grainCtx.fillRect(0, 0, 2048, 1208);
  const R = rng(f * 7 + 1);
  $('grain').style.transform = `translate(${Math.floor(R() * 64)}px,${Math.floor(R() * 64)}px)`;
}

/* ---------- share certificate (SVG, drawn — Commons was unreachable) ---------- */
(function buildCertificate() {
  const w = 600, h = 400, R = rng(77);
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="paper" cx="30%" cy="25%" r="90%"><stop offset="0" stop-color="#C9C1AD"/><stop offset=".6" stop-color="#A89E86"/><stop offset="1" stop-color="#7E745F"/></radialGradient>
  </defs>
  <rect width="${w}" height="${h}" fill="url(#paper)"/>
  <rect x="14" y="14" width="${w - 28}" height="${h - 28}" fill="none" stroke="#3E3A33" stroke-width="2.2"/>
  <rect x="22" y="22" width="${w - 44}" height="${h - 44}" fill="none" stroke="#3E3A33" stroke-width=".7"/>`;
  // guilloche border band
  for (let i = 0; i < 76; i++) {
    const x = 30 + i * ((w - 60) / 75);
    s += `<ellipse cx="${x.toFixed(1)}" cy="30" rx="6" ry="3" fill="none" stroke="#4A4438" stroke-width=".45"/>`;
    s += `<ellipse cx="${x.toFixed(1)}" cy="${h - 30}" rx="6" ry="3" fill="none" stroke="#4A4438" stroke-width=".45"/>`;
  }
  for (let i = 0; i < 50; i++) {
    const y = 36 + i * ((h - 72) / 49);
    s += `<ellipse cx="30" cy="${y.toFixed(1)}" rx="3" ry="6" fill="none" stroke="#4A4438" stroke-width=".45"/>`;
    s += `<ellipse cx="${w - 30}" cy="${y.toFixed(1)}" rx="3" ry="6" fill="none" stroke="#4A4438" stroke-width=".45"/>`;
  }
  // rosette vignette
  const rx = 118, ry = 210;
  for (let k = 0; k < 60; k++) s += `<ellipse cx="${rx}" cy="${ry}" rx="62" ry="22" transform="rotate(${k * 3} ${rx} ${ry})" fill="none" stroke="#4A4438" stroke-width=".35"/>`;
  s += `<circle cx="${rx}" cy="${ry}" r="66" fill="none" stroke="#3E3A33" stroke-width="1.2"/><circle cx="${rx}" cy="${ry}" r="20" fill="#D8CEB6" stroke="#3E3A33" stroke-width=".8"/>`;
  // title + body copy (no figures: every number on screen must come from the fact list)
  s += `<text x="372" y="96" text-anchor="middle" font-family="CormorantSub,serif" font-weight="500" font-size="34" letter-spacing="4" fill="#2F2B25">SHARE CERTIFICATE</text>
  <line x1="236" y1="112" x2="508" y2="112" stroke="#3E3A33" stroke-width=".7"/>
  <text x="372" y="140" text-anchor="middle" font-family="CormorantSub,serif" font-weight="300" font-size="15" letter-spacing="2.5" fill="#3A352D">THIS IS TO CERTIFY THAT THE BEARER</text>
  <text x="372" y="162" text-anchor="middle" font-family="CormorantSub,serif" font-weight="300" font-size="15" letter-spacing="2.5" fill="#3A352D">IS THE PROPRIETOR OF</text>
  <text x="372" y="204" text-anchor="middle" font-family="CormorantSub,serif" font-weight="500" font-size="30" letter-spacing="6" fill="#2F2B25">ONE SHARE</text>`;
  // fine print as engraved hairlines
  for (let i = 0; i < 6; i++) {
    const y = 236 + i * 13, len = 230 - R() * 40;
    s += `<line x1="${372 - len / 2}" y1="${y}" x2="${372 + len / 2}" y2="${y}" stroke="#3E3A33" stroke-width=".55" stroke-dasharray="${(2 + R() * 3).toFixed(1)} 1.4" opacity=".7"/>`;
  }
  // signatures
  const sig = (x0, y0) => { let d = `M${x0} ${y0}`; for (let i = 0; i < 7; i++) d += ` q ${6 + R() * 8} ${-12 + R() * 8} ${12 + R() * 6} ${R() * 6 - 1}`; return d; };
  s += `<path d="${sig(256, 346)}" fill="none" stroke="#2F2B25" stroke-width="1.1"/><line x1="246" y1="356" x2="370" y2="356" stroke="#3E3A33" stroke-width=".6"/>`;
  s += `<path d="${sig(410, 346)}" fill="none" stroke="#2F2B25" stroke-width="1.1"/><line x1="400" y1="356" x2="524" y2="356" stroke="#3E3A33" stroke-width=".6"/>`;
  // falloff away from the star (upper-left): the sheet sinks into the dark on its far side
  s += `<defs><linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070E" stop-opacity="0"/><stop offset=".55" stop-color="#05070E" stop-opacity=".28"/><stop offset="1" stop-color="#05070E" stop-opacity=".72"/></linearGradient></defs>
  <rect width="${w}" height="${h}" fill="url(#shade)"/>`;
  s += `</svg>`;
  $('cert').innerHTML = s;
})();

/* ---------- helpers that write styles ---------- */
function show(el, p, dy = 14, blur = 6) {   // long-exposure entrance: drift up a few px, de-blur
  el.style.opacity = p;
  el.style.transform = `translate3d(0,${((1 - p) * dy).toFixed(2)}px,0)`;
  el.style.filter = p < 0.999 ? `blur(${((1 - p) * blur).toFixed(2)}px)` : 'none';
}
const hide = el => { el.style.opacity = 0; el.style.filter = 'none'; };
const TEXT_IDS = ['s1a', 's1b', 's2a', 's2b'];

/* ============================================================
   SCENES  (frame ranges from the storyboard; t = seconds)
   1  0–120   2  120–300   3 300–510   4 510–750   5 750–960
   6 960–1200 7 1200–1410  8 1410–1590 9 1590–1800
   ============================================================ */
function scene1(f) {
  const t = f / FPS;
  // ≤3 movers at any moment: stars + planet(0–1.4) + line A(0.6–1.8) → stars + A + B(1.4–2.6) → stars + B + cert(1.8–3.2)
  const pl = enter(t, 0.0, 1.4);
  const planet = $('planet');
  planet.setAttribute('opacity', pl.toFixed(3));
  planet.setAttribute('transform', `translate(0 ${((1 - pl) * 70).toFixed(2)})`);
  show($('s1a'), enter(t, 0.6, 1.2));
  show($('s1b'), enter(t, 1.4, 1.2));
  const c = enter(t, 1.8, 1.4);
  placeCert(c, 1180, 262, 560, 12 * (1 - c));
}
function placeCert(alpha, x, y, w, dy = 0) {
  const el = $('cert');
  el.style.opacity = alpha;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.width = w + 'px'; el.style.height = (w / 1.5) + 'px';
  el.style.transform = `translate3d(0,${dy.toFixed(2)}px,0) perspective(1400px) rotateY(-9deg) rotateX(3deg)`;
}

const STR = { x0: 180, x1: 1180, y: 600 };
function scene2(f) {
  const t = (f - 120) / FPS;
  // cert shrinks into the lower-right corner (0–1.6s) while the string is drawn (0.3–1.7s)
  const c = enter(t, 0.03, 1.55);
  placeCert(1, lerp(1180, 1560, c), lerp(262, 772, c), lerp(560, 240, c));
  const draw = enter(t, 0.3, 1.4);
  const lift = enter(t, 1.9, 1.5) * 22;     // "＝" gently pulls both ends up
  const sag = lift * 0.55;
  const d = `M ${STR.x0} ${STR.y - lift} Q ${(STR.x0 + STR.x1) / 2} ${STR.y + sag} ${STR.x1} ${STR.y - lift}`;
  const g = $('string');
  g.setAttribute('opacity', draw > 0 ? 1 : 0);
  for (const id of ['stringCore', 'stringGlow']) {
    const p = $(id); p.setAttribute('d', d);
    const L = 1010; p.setAttribute('stroke-dasharray', `${L} ${L}`); p.setAttribute('stroke-dashoffset', ((1 - draw) * L).toFixed(1));
  }
  show($('s2a'), enter(t, 1.6, 1.3));
  show($('s2b'), enter(t, 3.0, 1.4));
}

/* ---------- transitions (only the three allowed kinds) ---------- */
// ③ hard cut to black for exactly one frame
const BLACK_FRAMES = new Set([120]);

function reset() {
  for (const id of TEXT_IDS) hide($(id));
  $('planet').setAttribute('opacity', 0);
  $('string').setAttribute('opacity', 0);
  $('cert').style.opacity = 0;
}

window.seek = function seek(frame) {
  const f = Math.max(0, Math.min(window.TOTAL_FRAMES - 1, Math.round(frame)));
  reset();
  drawStars(f, { brightness: 1 });
  drawGrain(f);
  if (inScene(f, 0, 120)) scene1(f);
  else if (inScene(f, 120, 300)) scene2(f);
  const fl = $('flash');
  if (BLACK_FRAMES.has(f)) { fl.style.background = '#000'; fl.style.opacity = 1; }
  else fl.style.opacity = 0;
  return f;
};

window.seek(0);
// live preview when opened directly: ?play  or  ?f=240
(function preview() {
  const q = new URLSearchParams(location.search);
  if (q.has('f')) window.seek(+q.get('f'));
  if (q.has('play')) {
    let f = 0;
    const tick = () => { window.seek(f); f = (f + 1) % window.TOTAL_FRAMES; setTimeout(tick, 1000 / FPS); };
    tick();
  }
})();
</script>
</body>
</html>
