/*@fonts-end*/
:root{
  --white:#E8EEF6; --ice:#7FB2E5; --gold:#C8A96A; --dim:rgba(232,238,246,.62);
  --sans:'InterSub','NotoSCSub','Source Han Sans SC','PingFang SC',sans-serif;
  --serif:'CormorantSub','Times New Roman',serif;
  --mono:'PlexMonoSub',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05070E}
#stage{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(ellipse 120% 100% at 32% 28%,#0B1220 0%,#080D18 45%,#05070E 100%)}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
svg.layer{overflow:visible}
.g{opacity:0}

/* type — light weights, +0.05em tracking, never bold */
.t{position:absolute;font-family:var(--sans);font-weight:300;letter-spacing:.05em;color:var(--white);
  white-space:nowrap;line-height:1.2;opacity:0}
.gold{color:var(--gold)}
.ice{color:var(--ice)}
.num{font-family:var(--mono);font-weight:300;letter-spacing:.02em;font-size:.96em}
.mono{font-family:var(--mono);font-weight:300;letter-spacing:.02em}

/* floating prints: cold, desaturated, lit from the upper-left star */
.card{position:absolute;opacity:0;transform-origin:50% 50%}
.card svg,.card img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.55) brightness(.92)}
.card.oval img{border-radius:50%}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  background:linear-gradient(135deg,rgba(150,180,215,.18),rgba(40,60,90,.35))}
.card::after{content:'';position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 1.5px 1.5px 0 rgba(232,238,246,.75),inset 3px 3px 6px -3px rgba(232,238,246,.32),-10px -10px 30px -18px rgba(232,238,246,.42)}
.card.oval::after,.card.oval::before{border-radius:50%}
.cap{position:absolute;font-family:var(--sans);font-weight:300;font-size:17px;letter-spacing:.06em;color:rgba(127,178,229,.62);opacity:0;white-space:nowrap}

#grain{position:absolute;left:-64px;top:-64px;width:2048px;height:1208px;opacity:.04;pointer-events:none}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 85% 80% at 50% 48%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="haze" class="layer" width="1920" height="1080"></canvas>
  <canvas id="stars" class="layer" width="1920" height="1080"></canvas>

  <svg id="world" class="layer" viewBox="0 0 1920 1080">
    <defs>
      <radialGradient id="planetFill" gradientUnits="userSpaceOnUse" cx="420" cy="760" r="2400">
        <stop offset="0" stop-color="#121B2C"/><stop offset=".35" stop-color="#0A101C"/><stop offset="1" stop-color="#05070D"/>
      </radialGradient>
      <linearGradient id="rimGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="0">
        <stop offset="0" stop-color="#E8EEF6" stop-opacity=".95"/><stop offset=".45" stop-color="#E8EEF6" stop-opacity=".55"/><stop offset="1" stop-color="#E8EEF6" stop-opacity=".08"/>
      </linearGradient>
      <linearGradient id="atmoGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="0">
        <stop offset="0" stop-color="#7FB2E5" stop-opacity=".55"/><stop offset=".6" stop-color="#7FB2E5" stop-opacity=".22"/><stop offset="1" stop-color="#7FB2E5" stop-opacity=".04"/>
      </linearGradient>
      <linearGradient id="leftLit" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="1180" y2="0">
        <stop offset="0" stop-color="#E8EEF6" stop-opacity=".95"/><stop offset="1" stop-color="#E8EEF6" stop-opacity=".45"/>
      </linearGradient>
      <linearGradient id="seaFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0C1626"/><stop offset=".35" stop-color="#080E1A"/><stop offset="1" stop-color="#05070E"/>
      </linearGradient>
      <linearGradient id="shipRim" gradientUnits="userSpaceOnUse" x1="1000" y1="0" x2="1380" y2="0">
        <stop offset="0" stop-color="#E8EEF6" stop-opacity=".75"/><stop offset="1" stop-color="#E8EEF6" stop-opacity=".05"/>
      </linearGradient>
      <radialGradient id="orb" cx="35%" cy="30%" r="75%">
        <stop offset="0" stop-color="#1A2740"/><stop offset=".6" stop-color="#0A1120"/><stop offset="1" stop-color="#04060C"/>
      </radialGradient>
      <filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="glow8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    </defs>

    <!-- S1 planet limb (lower quarter) -->
    <g id="planet" class="g">
      <circle cx="1180" cy="4040" r="3200" fill="url(#planetFill)"/>
      <circle cx="1180" cy="4040" r="3203" fill="none" stroke="url(#atmoGrad)" stroke-width="9" filter="url(#soft)"/>
      <circle cx="1180" cy="4040" r="3200" fill="none" stroke="url(#rimGrad)" stroke-width="1.6"/>
    </g>

    <!-- title rule -->
    <line id="titleRule" x1="182" y1="596" x2="560" y2="596" stroke="url(#leftLit)" stroke-width="1.2" class="g"/>

    <!-- S2 string -->
    <g id="string" class="g">
      <path id="stringGlow" fill="none" stroke="#E8EEF6" stroke-opacity=".35" stroke-width="5" filter="url(#glow3)"/>
      <path id="stringCore" fill="none" stroke="url(#leftLit)" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- S4 sea, ship, VOC -->
    <g id="sea" class="g">
      <rect x="-20" y="812" width="1960" height="290" fill="url(#seaFill)"/>
      <line x1="0" y1="812" x2="1920" y2="812" stroke="url(#rimGrad)" stroke-width="1.2"/>
      <g id="glitter"></g>
    </g>
    <g id="ship" class="g"></g>
    <g id="voc" class="g" transform="translate(1560 236) scale(1.25)">
      <path id="vocV" d="M -64 -70 L 0 62 L 64 -70" fill="none" stroke="#C8A96A" stroke-width="1.6" stroke-linejoin="round"/>
      <path id="vocO" d="M -36 -22 m -23 0 a 23 23 0 1 0 46 0 a 23 23 0 1 0 -46 0" fill="none" stroke="#C8A96A" stroke-width="1.6"/>
      <path id="vocC" d="M 52 -38 A 23 23 0 1 0 52 -6" fill="none" stroke="#C8A96A" stroke-width="1.6"/>
      <circle id="vocRing" cx="0" cy="-8" r="98" fill="none" stroke="#C8A96A" stroke-opacity=".45" stroke-width=".8"/>
    </g>

    <!-- S6 bubble curve -->
    <g id="bubble" class="g">
      <path id="bubbleGlow" fill="none" stroke="#A3434B" stroke-opacity=".55" stroke-width="7" filter="url(#glow8)"/>

function bezier(x1, y1, x2, y2) {             // cubic-bezier solver
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;

/* ---------- bubble curve (scene 6): 128 → 950 → 150, per the fact list ---------- */
const BUB = (() => {
  const X0 = 180, X1 = 1000, Ylo = 770, Yhi = 300;
  const yOf = v => lerp(Ylo, Yhi, (v - 128) / (950 - 128));
  const pts = [];
  for (let i = 0; i <= 120; i++) {
    const u = i / 120;
    const v = u < 0.55 ? 128 + (950 - 128) * Math.pow(u / 0.55, 2.6) : 150 + (950 - 150) * Math.exp(-Math.pow((u - 0.55) / 0.17, 2) * 1.6);
    pts.push([lerp(X0, X1, u), yOf(v)]);
  }
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
  let len = 0; const cum = [0];
  for (let i = 1; i < pts.length; i++) { len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(len); }
  $('bubbleCore').setAttribute('d', d); $('bubbleGlow').setAttribute('d', d);
  const ro = $('bubbleReadouts');
  const els = [[0, '£128', -6, 34], [66, '£950', 18, -14], [120, '£150', 12, -8]].map(([i, txt, dx, dy]) => {
    const e = svgEl('text', { x: pts[i][0] + dx, y: pts[i][1] + dy, opacity: 0 }, ro); e.textContent = txt; return { e, i };
  });
  return { pts, cum, len, els };
})();

  let p = 100;
  for (let i = 0; i < n; i++) {
    const o = p; p = p * (1 + 0.016 + (R() - 0.5) * 0.07); const c = p;
    out.push({ o, c, h: Math.max(o, c) * (1 + R() * 0.02), l: Math.min(o, c) * (1 - R() * 0.02), x: x0 + (i + 0.5) * step });

})();

function drawNebula(p, dir) {                    // p: 0→1 across the transition; the scene swaps under full cover at 0.5
  if (p <= 0 || p >= 1) return;
  const sx = NEB.small.getContext('2d'), img = sx.createImageData(NEB.w, NEB.h);
  const e1 = lerp(-0.25, 2.45, p), e2 = e1 - 1.45, drift = p * 18;
  for (let y = 0; y < NEB.h; y++) for (let x = 0; x < NEB.w; x++) {
    const n = NEB.n1(x + drift, y) * 0.7 + NEB.n2(x - drift, y) * 0.3;
    let xn = x / NEB.w; if (dir < 0) xn = 1 - xn;
    xn += (n - 0.5) * 0.42;
    const cov = smooth(-0.14, 0.02, e1 - xn) * smooth(-0.14, 0.02, xn - e2);
    const i = (y * NEB.w + x) * 4, b = 6 + n * 16;
    img.data[i] = b * 0.7; img.data[i + 1] = b * 0.85; img.data[i + 2] = b * 1.35; img.data[i + 3] = cov * 255;

    const img = $('vocImg');
    if (img) img.style.clipPath = `inset(0 ${((1 - v) * 100).toFixed(2)}% 0 0)`;
    else for (const [id, L] of [['vocV', 300], ['vocO', 146], ['vocC', 120], ['vocRing', 620]]) { const e = $(id); e.setAttribute('stroke-dasharray', `${L} ${L}`); e.setAttribute('stroke-dashoffset', ((1 - v) * L).toFixed(1)); }
  },
  s5(t) {
    const a = enter(t, 0.0, 1.0);
    placeCard('exchange', { alpha: a, x: 760, y: 140, w: 980, h: 560, scale: lerp(1.0, 1.06, inOutSine(clamp(t / 6))), tilt: false });
    $('capExchange').style.opacity = a * 0.9;
    runTexts('s5', t);
  },
  s6(t) {
    runTexts('s6', t);
    const p = enter(t, 0.8, 2.2, x => x);                  // the comet keeps a constant pace
    $('bubble').style.opacity = p > 0 ? 1 : 0;
    const L = BUB.len, drawn = p * L;
    for (const id of ['bubbleCore', 'bubbleGlow']) { const e = $(id); e.setAttribute('stroke-dasharray', `${L} ${L}`); e.setAttribute('stroke-dashoffset', (L - drawn).toFixed(1)); }
    let i = BUB.cum.findIndex(c => c >= drawn); if (i < 0) i = BUB.pts.length - 1;
    for (const id of ['bubbleHead', 'bubbleHeadGlow']) { $(id).setAttribute('cx', BUB.pts[i][0]); $(id).setAttribute('cy', BUB.pts[i][1]); }
    for (const { e, i: k } of BUB.els) e.setAttribute('opacity', clamp((drawn - BUB.cum[k]) / 60).toFixed(3));
    const hg = enter(t, 1.3, 1.0);
    placeCard('hogarth', { alpha: hg, x: 1110, y: 140, w: 540, h: 380, dy: 10 * (1 - hg) });
    $('capHogarth').style.opacity = hg * 0.9;
    const nw = enter(t, 3.2, 0.9);
    placeCard('newton', { alpha: nw, x: 1540, y: 640, w: 170, h: 212, dy: 10 * (1 - nw), tilt: false });
  },
  s7(t) {
    $('balance').style.opacity = enter(t, 0.0, 0.9);
    const ang = 2.6 * Math.exp(-t / 1.25) * Math.sin(2 * Math.PI * t / 2.6), rad = ang * Math.PI / 180;   // tiny swing, then still
    balance.beam.setAttribute('transform', `translate(${BAL.x} ${BAL.y}) rotate(${ang.toFixed(4)})`);
    for (const { p, side } of balance.pans) p.setAttribute('transform', `translate(${(BAL.x + Math.cos(rad) * BAL.arm * side).toFixed(2)} ${(BAL.y + Math.sin(rad) * BAL.arm * side).toFixed(2)})`);
    runTexts('s7', t);
  },
  s8(t) {
    $('horizon8').style.opacity = enter(t, 0.0, 0.8);
    runTexts('s8', t);
    const bw = SKY.step * 0.56;
    fx.save(); fx.beginPath(); fx.rect(0, 0, W, 820); fx.clip();
    for (let i = 0; i < SKY.out.length; i++) {             // the skyline rises out of the horizon (one group mover)
      const k = SKY.out[i], rise = enter(t, 0.1 + i * 0.022, 1.0); if (rise <= 0) continue;
      const col = k.c >= k.o ? '178,74,82' : '63,138,108';
      const yo = SKY.Y(k.o), yc = SKY.Y(k.c), off = (1 - rise) * (830 - SKY.Y(k.h));
      const top = Math.min(yo, yc) + off, bh = Math.max(Math.abs(yo - yc), 3);
      fx.strokeStyle = `rgba(${col},.8)`; fx.lineWidth = 1.2;
      fx.beginPath(); fx.moveTo(k.x, SKY.Y(k.h) + off); fx.lineTo(k.x, SKY.Y(k.l) + off); fx.stroke();
      fx.fillStyle = `rgba(${col},.88)`; fx.fillRect(k.x - bw / 2, top, bw, bh);
      fx.fillStyle = 'rgba(232,238,246,.35)'; fx.fillRect(k.x - bw / 2, top, 1, bh);
    }
    fx.restore();
    fx.save(); fx.beginPath(); fx.rect(0, 822, W, 258); fx.clip(); fx.globalAlpha = 0.1;
    for (let i = 0; i < SKY.out.length; i++) {
      const k = SKY.out[i], rise = enter(t, 0.1 + i * 0.022, 1.0); if (rise <= 0) continue;
      const yo = SKY.Y(k.o), yc = SKY.Y(k.c), top = 1640 - Math.max(yo, yc) - (1 - rise) * 600;
      fx.fillStyle = k.c >= k.o ? 'rgb(178,74,82)' : 'rgb(63,138,108)'; fx.fillRect(k.x - bw / 2, top, bw, Math.max(Math.abs(yo - yc), 3));
    }
    fx.restore();
    const tr = enter(t, 1.6, 1.6, inOutSine), e = $('trend');
    e.style.opacity = tr > 0 ? 1 : 0; e.setAttribute('stroke-dasharray', `${SKY.trendLen} ${SKY.trendLen}`); e.setAttribute('stroke-dashoffset', ((1 - tr) * SKY.trendLen).toFixed(1));
  },
  s9(t) { runTexts('s9', t); },
  end() {},
};

/* ============================================================
   seek(frame) — the only entry point the renderer calls
   ============================================================ */
const ALL_G = ['planet', 'titleRule', 'string', 'sea', 'ship', 'voc', 'bubble', 'balance', 'horizon8', 'trend'];
const ALL_CARDS = ['cert', 'exchange', 'hogarth', 'newton'];
function reset() {
  for (const list of Object.values(TEXT_EL)) for (const { el } of list) { el.style.opacity = 0; el.style.filter = 'none'; }
  for (const id of ALL_G) $(id).style.opacity = 0;
  for (const id of ALL_CARDS) $(id).style.opacity = 0;
  $('capExchange').style.opacity = 0; $('capHogarth').style.opacity = 0;
  fx.clearRect(0, 0, W, H);
  nebCtx.clearRect(0, 0, W, H);
}

window.seek = function seek(frame) {
  const f = Math.max(0, Math.min(window.TOTAL_FRAMES - 1, Math.round(frame)));
  reset();
  const sc = SCENES.find(s => f >= s.a && f < s.b);
  const zoom = f >= 1530 ? lerp(1, 0.86, inOutSine(clamp((f - 1530) / 270))) : 1;   // scene 9: the stars fall away
  drawStars(f, zoom);
  drawGrain(f);
  R_[sc.id]((f - sc.a) / FPS);

  const fl = $('flash'); fl.style.opacity = 0;
  for (const c of CUTS) {
    const d = f - c.f;
    if (c.kind === 'black' && d === 0) { fl.style.background = '#000'; fl.style.opacity = 1; }
    if (c.kind === 'flash' && d >= -2 && d <= 4) {           // overexpose for an instant, then press back into the dark
      fl.style.background = '#EEF3FA'; fl.style.opacity = { '-2': .06, '-1': .22, 0: .92, 1: .42, 2: .18, 3: .07, 4: .02 }[d];
    }
    if (c.kind === 'nebula' && d >= -12 && d <= 12) drawNebula((d + 12) / 24, c.f === 750 ? -1 : 1);
  }
  return f;
};

window.seek(0);
(function preview() {                              // ?f=600 to inspect one frame; ?play to scrub in real time
  const q = new URLSearchParams(location.search);
  if (q.has('f')) window.seek(+q.get('f'));
  if (q.has('play')) { let f = 0; const tick = () => { window.seek(f); f = (f + 1) % window.TOTAL_FRAMES; setTimeout(tick, 1000 / FPS); }; tick(); }
})();
</script>
