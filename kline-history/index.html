<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交易的矩阵</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --gold:#C9A66B; --gold-hi:#EBD3A1; --gold-dim:rgba(201,166,107,.55);
  --ivory:#EFE8DC; --dim:rgba(239,232,220,.58); --faint:rgba(239,232,220,.34);
  --serif:'NotoSerifSub','Noto Serif SC','Songti SC',serif;
  --latin:'CormorantSub','Cormorant Garamond','Times New Roman',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;background:#000;isolation:isolate}
#grainO{mix-blend-mode:overlay;display:none}
#grainS{mix-blend-mode:screen;display:none}
canvas{position:absolute;left:0;top:0}
.abs{position:absolute;white-space:nowrap}

/* ---------- header: era (top-left) ---------- */
#era{left:122px;top:92px;display:flex;align-items:baseline;gap:18px;color:var(--gold)}
#eraPre{font-family:var(--serif);font-weight:400;font-size:58px;letter-spacing:.04em;color:var(--gold);opacity:.92}
#eraNum{display:flex;font-feature-settings:'lnum' 1;font-variant-numeric:lining-nums;font-family:var(--latin);font-weight:500;font-size:96px;line-height:1;letter-spacing:.02em}
.dg{display:inline-block;height:96px;overflow:hidden;position:relative}
.dg>span{display:block}
.dg>span>i{font-feature-settings:'lnum' 1;font-variant-numeric:lining-nums;display:block;height:96px;line-height:96px;font-style:normal;text-align:center;
  background:linear-gradient(180deg,#F1DCAC 10%,#C9A66B 60%,#9C7B45 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
#eraSuf{font-family:var(--serif);font-size:40px;color:var(--gold);opacity:.85}
#place{left:126px;top:200px;font-family:var(--serif);font-weight:400;font-size:38px;letter-spacing:.12em;color:var(--dim)}

/* ---------- header: citation (top-right) ---------- */
#cite{right:150px;top:94px;text-align:right}
#citeLat{font-family:var(--latin);font-style:italic;font-weight:400;font-size:34px;letter-spacing:.02em;color:var(--dim)}
#citeZh{font-family:var(--serif);font-weight:500;font-size:42px;letter-spacing:.06em;color:var(--gold);margin-top:4px}
#citeNote{font-family:var(--serif);font-size:24px;letter-spacing:.12em;color:var(--faint);margin-top:8px}
#seal{position:absolute;right:-42px;top:58px;width:22px;height:22px;background:#9E2B25;border-radius:2px;
  box-shadow:inset 0 0 0 1.5px rgba(255,210,190,.25);opacity:.9}
#seal::after{content:'';position:absolute;inset:4px;border:1px solid rgba(255,220,200,.45)}

/* ---------- subtitles ---------- */
#subs{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.sub{position:absolute;left:50%;top:858px;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--serif);font-weight:500;font-size:64px;letter-spacing:.05em;color:var(--ivory);
  text-shadow:0 2px 24px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6);line-height:1.2;opacity:0}
.sub .c{display:inline-block}
.sub.pT{top:250px;font-size:62px}
.sub.pC{top:540px;font-size:80px}
.sub.pL{left:150px;top:300px;transform:none;text-align:left;font-size:60px;line-height:1.42}
.sub.pR{left:auto;right:150px;top:300px;transform:none;text-align:right;font-size:60px;line-height:1.42}
.sub .k{font-weight:700;font-size:1.14em;
  background:linear-gradient(100deg,rgba(255,250,236,0) 38%,rgba(255,250,236,.95) 50%,rgba(255,250,236,0) 62%),linear-gradient(180deg,#F6E2B4 0%,#D8B676 52%,#A9864B 100%);
  background-size:320% 100%,100% 100%;background-position:var(--sx,105%) 0,0 0;background-repeat:no-repeat;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(214,178,110,.28))}
.sub .kw{position:relative;display:inline-block}
.sub .kw::after{content:'';position:absolute;left:3%;right:3%;bottom:-.02em;height:2px;
  background:linear-gradient(90deg,rgba(232,204,142,0),#EBD3A1 18%,#EBD3A1 82%,rgba(232,204,142,0));
  transform:scaleX(var(--u,0));transform-origin:0 50%;opacity:var(--uo,0);box-shadow:0 0 10px rgba(235,211,161,.45)}
.sub .nm{color:var(--gold-hi);font-weight:600}

/* ---------- title & chapter cards ---------- */
.card{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
.card .c{display:inline-block}
#tLatin{top:370px;font-family:var(--latin);font-weight:500;font-style:italic;font-size:30px;letter-spacing:.22em;color:var(--gold-dim);text-indent:.22em}
#tMain{top:420px;font-family:var(--serif);font-weight:700;font-size:118px;letter-spacing:.14em;text-indent:.14em;line-height:1.2}
#tMain .c{background:linear-gradient(180deg,#F8E7C0 0%,#D9B878 50%,#9A7840 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(214,178,110,.25))}
#tSub{top:628px;font-family:var(--serif);font-weight:400;font-size:36px;letter-spacing:.32em;text-indent:.32em;color:var(--dim)}

#chNum{top:330px;font-family:var(--serif);font-weight:700;font-size:66px;color:var(--gold);letter-spacing:.1em;text-indent:.1em}
#chLat{top:426px;font-family:var(--latin);font-weight:500;font-size:26px;letter-spacing:.6em;text-indent:.6em;color:var(--gold-dim)}
#chTitle{top:470px;font-family:var(--serif);font-weight:600;font-size:88px;letter-spacing:.16em;text-indent:.16em;color:var(--ivory)}
#chSub{top:606px;font-family:var(--serif);font-weight:400;font-size:36px;letter-spacing:.3em;text-indent:.3em;color:var(--dim)}

/* ---------- section heading (flies into the header's place slot) ---------- */
#secs{position:absolute;inset:0;pointer-events:none}
.sech{position:absolute;inset:0}
.shVeil{position:absolute;left:360px;top:300px;width:1200px;height:440px;background:radial-gradient(closest-side,rgba(12,9,6,.82),rgba(12,9,6,.55) 55%,rgba(12,9,6,0))}
.shNum{position:absolute;left:0;right:0;top:396px;text-align:center;font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:.42em;text-indent:.42em;color:var(--gold)}
.shTitle{position:absolute;left:0;top:0;transform-origin:0 0;white-space:nowrap;font-family:var(--serif);font-weight:600;font-size:88px;letter-spacing:.16em;line-height:1.2;color:var(--ivory)}
.shTitle .c{display:inline-block}
.shSub{position:absolute;left:0;right:0;top:604px;text-align:center;font-family:var(--serif);font-weight:400;font-size:36px;letter-spacing:.3em;text-indent:.3em;color:var(--dim)}

/* ---------- finale: white classical light serif with the English line ---------- */
#finale{top:410px;font-family:var(--serif);font-weight:300;font-size:62px;letter-spacing:.16em;text-indent:.16em;line-height:1.75;color:#F4F0E8}
#finale .c{display:inline-block}
#finaleEn{position:absolute;left:50%;top:668px;white-space:nowrap;font-family:var(--latin);font-weight:300;font-style:italic;font-size:34px;letter-spacing:.04em;color:#EDE7DC}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>

  <div id="era" class="abs"><span id="eraPre"></span><span id="eraNum"></span><span id="eraSuf"></span></div>
  <div id="place" class="abs"></div>
  <div id="cite" class="abs"><div id="citeLat"></div><div id="citeZh"></div><div id="citeNote"></div><div id="seal"></div></div>

  <div id="tLatin" class="card"></div>
  <div id="tMain" class="card"></div>
  <div id="tSub" class="card"></div>

  <div id="chNum" class="card"></div>
  <div id="chLat" class="card"></div>
  <div id="chTitle" class="card"></div>
  <div id="chSub" class="card"></div>

  <div id="secs"></div>
  <div id="subs"></div>
  <div id="finale" class="card"></div>
  <div id="finaleEn"></div>

  <canvas id="post" width="1920" height="1080"></canvas>
  <canvas id="grainO" width="1920" height="1080"></canvas>
  <canvas id="grainS" width="1920" height="1080"></canvas>
</div>
<script src="build/timeline.js"></script>
<script src="src/film.js"></script>
<script src="src/lib.js"></script>
<script src="src/scenes.js"></script>
<script src="src/main.js"></script>
</body>
</html>
