<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ======================================================================
   《认识交易市场》 —— 博物馆文物编年体 · 78s · 1920×1080 @30fps
   Every pixel is a pure function of the frame number: window.seek(frame).
   No CSS transitions, no Date.now(), no Math.random — "randomness" is a
   hash of (index, seed), so frame N always renders identically.
   ====================================================================== */

/* ---------------- 可调参数 ---------------- */
const CANVAS        = { w: 1920, h: 1080 };   // 横版 16:9（竖版改 1080×1920，安全区改底部 300）
const SAFE_MARGIN   = { x: 120, bottom: 140 };
const FPS           = 30;
const TOTAL_FRAMES  = 2340;                   // 78 秒，不压缩
const DUST_COUNT    = 100;
const GRAIN_OPACITY = 0.05;
const SUBTITLE_Y    = 880;
const RED_BUDGET    = 6;
const SHOW_TITLE    = true;                   // 开场标题「认识交易市场」                      // 实际用到 3 处：文献章 / 米券朱印 / S7 按键指示

/* ---------------- palette ---------------- */
const C = {
  bg: '#0E0B08', glow: '#1A140C', ivory: '#E8DFC8', gold: '#C8A96A', bright: '#E8C87A',
  gray: '#8A7F6E', red: '#A03A2E', ink: '#2E241A', brass: '#B08A52',
};
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* ---------------- fonts ---------------- */
const F_SONG = 'SongSC, Play, serif';
const F_PLAY = 'Play, SongSC, serif';

/* ---------------- math ---------------- */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const p = (f, a, b) => clamp((f - a) / (b - a));
function cubicBezier(x1, y1, x2, y2) {
  const bx = t => 3 * (1 - t) * (1 - t) * t * x1 + 3 * (1 - t) * t * t * x2 + t * t * t;
  const by = t => 3 * (1 - t) * (1 - t) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1;
    for (let i = 0; i < 26; i++) { const m = (lo + hi) / 2; if (bx(m) < x) lo = m; else hi = m; }
    return by((lo + hi) / 2);
  };
}
const EXPO = cubicBezier(.16, 1, .3, 1);                 // 全片唯一入场曲线
const E = (f, a, b) => EXPO(p(f, a, b));
const inC = t => t * t * t;
const inOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const damped = (t, A, w) => A * Math.exp(-2.2 * t) * Math.cos(w * t);   // 摆动收敛
function h32(n) {
  n = (n | 0) ^ 0x9e3779b9;
  n = Math.imul(n ^ (n >>> 16), 0x85ebca6b);
  n = Math.imul(n ^ (n >>> 13), 0xc2b2ae35);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
const rnd = (i, k = 0) => h32(Math.imul(i | 0, 7919) + Math.imul(k | 0, 104729) + 17);
function vnoise(x, seed) { const i = Math.floor(x), t = x - i, s = t * t * (3 - 2 * t); return lerp(rnd(i, seed), rnd(i + 1, seed), s); }
const qbez = (a, c, b, t) => ({ x: (1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * c.x + t * t * b.x, y: (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * c.y + t * t * b.y });
const qtan = (a, c, b, t) => Math.atan2(2 * (1 - t) * (c.y - a.y) + 2 * t * (b.y - c.y), 2 * (1 - t) * (c.x - a.x) + 2 * t * (b.x - c.x));

/* ---------------- canvas ---------------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const LAYER = mk(1920, 1080), lctx = LAYER.getContext('2d', { willReadFrequently: true });
const TMP = mk(900, 900), tctx = TMP.getContext('2d');

function text(g, s, x, y, font, color, align = 'left', alpha = 1, spacing = 0) {
  g.save(); g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'alphabetic';
  g.globalAlpha *= alpha; g.letterSpacing = spacing + 'px'; g.fillText(s, x, y); g.restore();
}
function strokePartial(g, pts, k) {           // draw the first fraction k of a polyline's length
  if (k <= 0 || pts.length < 2) return;
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); seg.push(d); total += d; }
  let left = total * clamp(k);
  g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length && left > 0; i++) {
    const d = seg[i - 1];
    if (d <= left) { g.lineTo(pts[i].x, pts[i].y); left -= d; }
    else { const t = left / d; g.lineTo(lerp(pts[i - 1].x, pts[i].x, t), lerp(pts[i - 1].y, pts[i].y, t)); left = 0; }
  }
  g.stroke();
}
function rrect(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.roundRect(x, y, w, h, r); }

/* ---------------- static textures (built once, deterministic) ---------------- */
let GRAIN = [], VIGNETTE, NOISE, COIN, PARCH, TICKET, LOGO;
const NW = 480, NH = 270;                      // dissolve noise grid: 4px cells

function buildStatic() {
  // film grain — 4 tiles, cycled per frame with hashed offsets
  for (let k = 0; k < 4; k++) {
    const c = mk(960, 540), g = c.getContext('2d'), im = g.createImageData(960, 540);
    for (let i = 0; i < 960 * 540; i++) {
      const v = clamp(Math.round(18 + (rnd(i, 101 + k) + rnd(i, 211 + k) - 1) * 150), 0, 255);
      im.data[i * 4] = v; im.data[i * 4 + 1] = v * 0.96; im.data[i * 4 + 2] = v * 0.9; im.data[i * 4 + 3] = 255;
    }
    g.putImageData(im, 0, 0); GRAIN.push(c);
  }
  // vignette: edges pressed down 35%
  VIGNETTE = mk(1920, 1080);
  { const g = VIGNETTE.getContext('2d'), gr = g.createRadialGradient(960, 520, 360, 960, 540, 1150);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.75, 'rgba(0,0,0,0.28)'); gr.addColorStop(1, 'rgba(0,0,0,0.42)');
    g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080); }
  // dissolve noise: coarse patches + fine grains
  NOISE = new Float32Array(NW * NH);
  for (let y = 0; y < NH; y++) for (let x = 0; x < NW; x++) {
    const cx = x / 16, cy = y / 16, ix = Math.floor(cx), iy = Math.floor(cy), tx = cx - ix, ty = cy - iy;
    const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const a = rnd(ix + iy * 97, 7), b = rnd(ix + 1 + iy * 97, 7), c2 = rnd(ix + (iy + 1) * 97, 7), d = rnd(ix + 1 + (iy + 1) * 97, 7);
    const coarse = lerp(lerp(a, b, sx), lerp(c2, d, sx), sy);
    NOISE[y * NW + x] = coarse * 0.55 + rnd(x + y * NW, 9) * 0.45;
  }
  buildCoin(); buildParchment(); buildTicket(); buildTree();
}

/* ---------- 古金币 (owl-and-olive relief, matte aged gold, no lettering) ---------- */
function emboss(g, path, base, depth = 1) {
  g.save(); g.translate(3 * depth, 4 * depth); g.fillStyle = 'rgba(28,24,18,.55)'; g.beginPath(); path(g); g.fill(); g.restore();
  g.save(); g.translate(-2 * depth, -2 * depth); g.fillStyle = 'rgba(255,252,242,.55)'; g.beginPath(); path(g); g.fill(); g.restore();
  g.fillStyle = base; g.beginPath(); path(g); g.fill();
}
function embossLine(g, path, w, base) {
  g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = w;
  g.save(); g.translate(2.5, 3); g.strokeStyle = 'rgba(28,24,18,.55)'; g.beginPath(); path(g); g.stroke(); g.restore();
  g.save(); g.translate(-1.5, -1.5); g.strokeStyle = 'rgba(255,252,242,.6)'; g.beginPath(); path(g); g.stroke(); g.restore();
  g.strokeStyle = base; g.beginPath(); path(g); g.stroke();
}
function buildCoin() {
  COIN = mk(640, 640); const g = COIN.getContext('2d'); g.translate(320, 320);
  const gr = g.createRadialGradient(-100, -120, 20, 0, 0, 300);
  gr.addColorStop(0, '#F3DFA2'); gr.addColorStop(.5, '#C49A4C'); gr.addColorStop(1, '#6E4E1E');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 300, 0, TAU); g.fill();
  // rim
  g.lineWidth = 16; g.strokeStyle = 'rgba(74,52,20,.55)'; g.beginPath(); g.arc(0, 0, 290, 0, TAU); g.stroke();
  g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,248,.35)'; g.beginPath(); g.arc(-1, -1, 281, Math.PI * 0.9, Math.PI * 1.9); g.stroke();
  // beaded border
  for (let i = 0; i < 72; i++) { const a = i / 72 * TAU; emboss(g, gg => gg.arc(Math.cos(a) * 258, Math.sin(a) * 258, 6, 0, TAU), '#CFA45A', .6); }
  const base = '#D2A75C';
  // owl body + head
  emboss(g, gg => { gg.ellipse(-20, 45, 92, 128, 0, 0, TAU); }, base);
  emboss(g, gg => { gg.arc(-20, -92, 74, 0, TAU); }, '#DAB067');
  // eyes
  for (const ex of [-54, 14]) {
    emboss(g, gg => gg.arc(ex, -96, 29, 0, TAU), '#E6C27C');
    g.fillStyle = '#4E3714'; g.beginPath(); g.arc(ex + 2, -94, 10, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,250,.6)'; g.beginPath(); g.arc(ex - 2, -98, 3, 0, TAU); g.fill();
  }
  emboss(g, gg => { gg.moveTo(-28, -70); gg.lineTo(-12, -70); gg.lineTo(-20, -46); gg.closePath(); }, '#B88E44');
  // feathers
  for (let r = 0; r < 5; r++) for (let c = 0; c < 4 - (r > 2 ? 1 : 0); c++) {
    const x = -66 + c * 30 + (r % 2) * 15, y = -10 + r * 30;
    embossLine(g, gg => { gg.moveTo(x - 10, y); gg.quadraticCurveTo(x, y + 12, x + 10, y); }, 3, '#B08742');
  }
  embossLine(g, gg => { gg.moveTo(-70, 172); gg.lineTo(40, 172); }, 5, '#B08742');
  // olive sprig
  embossLine(g, gg => { gg.moveTo(-200, -60); gg.quadraticCurveTo(-170, -140, -120, -190); }, 4, '#BC9248');
  for (const [x, y, a] of [[-180, -100, -0.9], [-150, -150, -0.4], [-195, -150, -1.6], [-130, -195, 0.1]])
    emboss(g, gg => gg.ellipse(x, y, 20, 8, a, 0, TAU), '#C99E52', .7);
  // crescent
  emboss(g, gg => { gg.arc(-175, 60, 30, Math.PI * 0.6, Math.PI * 1.6); gg.arc(-163, 60, 24, Math.PI * 1.5, Math.PI * 0.65, true); gg.closePath(); }, '#C99E52', .7);
  // second olive sprig where an inscription would be — the coin carries no lettering
  embossLine(g, gg => { gg.moveTo(200, 60); gg.quadraticCurveTo(170, -20, 120, -90); }, 4, '#BC9248');
  for (const [x, y, a] of [[184, 20, 0.9], [156, -30, 0.5], [196, -24, 1.6], [134, -76, -0.1]])
    emboss(g, gg => gg.ellipse(x, y, 20, 8, a, 0, TAU), '#C99E52', .7);
  emboss(g, gg => gg.arc(170, 96, 9, 0, TAU), '#C99E52', .6);
  // patina, wear and scratches
  for (let i = 0; i < 3800; i++) {
    const a = rnd(i, 31) * TAU, r = Math.sqrt(rnd(i, 32)) * 296, s = 0.6 + rnd(i, 33) * 2.2;
    g.fillStyle = rnd(i, 34) < .7 ? `rgba(40,36,28,${0.05 + rnd(i, 35) * 0.12})` : `rgba(255,250,235,${0.04 + rnd(i, 35) * 0.08})`;
    g.fillRect(Math.cos(a) * r, Math.sin(a) * r, s, s);
  }
  g.strokeStyle = 'rgba(60,56,48,.18)'; g.lineWidth = 1;
  for (let i = 0; i < 16; i++) { const a = rnd(i, 41) * TAU, r = rnd(i, 42) * 220, l = 20 + rnd(i, 43) * 60, b = rnd(i, 44) * TAU;
    g.beginPath(); g.moveTo(Math.cos(a) * r, Math.sin(a) * r); g.lineTo(Math.cos(a) * r + Math.cos(b) * l, Math.sin(a) * r + Math.sin(b) * l); g.stroke(); }
  // warm toning toward the edge
  const tone = g.createRadialGradient(0, 0, 150, 0, 0, 300); tone.addColorStop(0, 'rgba(120,80,30,0)'); tone.addColorStop(1, 'rgba(90,60,20,.25)');
  g.fillStyle = tone; g.beginPath(); g.arc(0, 0, 300, 0, TAU); g.fill();
}
function drawCoin(g, x, y, r, ang, dark = 0) {
  const c = Math.cos(ang), s = Math.sin(ang), rx = Math.max(0.5, r * Math.abs(c)), ex = r * 0.085 * s;
  if (Math.abs(ex) > 0.3) {                                     // the coin's edge, seen as a short cylinder
    const eg = g.createLinearGradient(0, y - r, 0, y + r);
    eg.addColorStop(0, '#B08A48'); eg.addColorStop(.5, '#6E5126'); eg.addColorStop(1, '#3E2C12');
    g.fillStyle = eg; g.beginPath(); g.ellipse(x + ex, y, rx, r, 0, 0, TAU); g.fill();
    g.fillRect(Math.min(x, x + ex), y - r, Math.abs(ex), 2 * r);
  }
  g.save(); g.translate(x, y); g.scale(rx / 300, r / 300); g.drawImage(COIN, -320, -320); g.restore();
  if (dark > 0) { g.fillStyle = `rgba(8,6,4,${dark})`; g.beginPath(); g.ellipse(x, y, rx + 1, r + 1, 0, 0, TAU); g.fill(); }
}
function coinReflection(g, x, y, r, ang, floorY, alpha) {
  if (alpha <= 0.005) return;
  tctx.clearRect(0, 0, 900, 900);
  const cy = 450; drawCoin(tctx, 450, cy, r, ang);
  tctx.save(); tctx.globalCompositeOperation = 'destination-in';
  const gr = tctx.createLinearGradient(0, cy + r, 0, cy - r * 0.2);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  tctx.fillStyle = gr; tctx.fillRect(0, 0, 900, 900); tctx.restore();
  g.save(); g.globalAlpha *= alpha; g.translate(x, 2 * floorY - y); g.scale(1, -1); g.drawImage(TMP, -450, -cy); g.restore();
}

/* ---------- 羊皮纸 ---------- */
const PW = 560, PH = 430;
function buildParchment() {
  PARCH = mk(PW, PH); const g = PARCH.getContext('2d');
  g.fillStyle = '#E3D7BA'; g.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 900; i++) {
    const x = rnd(i, 51) * PW, y = rnd(i, 52) * PH, r = 6 + rnd(i, 53) * 40;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const dark = rnd(i, 54) < .6; gr.addColorStop(0, dark ? 'rgba(150,120,70,.07)' : 'rgba(255,250,232,.08)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  const ed = g.createRadialGradient(PW / 2, PH / 2, 120, PW / 2, PH / 2, 360);
  ed.addColorStop(0, 'rgba(120,85,40,0)'); ed.addColorStop(1, 'rgba(110,75,35,.45)');
  g.fillStyle = ed; g.fillRect(0, 0, PW, PH);
  // ragged deckled edge
  g.globalCompositeOperation = 'destination-in'; g.fillStyle = '#000'; g.beginPath();
  const J = (i, k) => (vnoise(i * 0.35, k) - .5) * 10;
  g.moveTo(8, 8);
  for (let x = 8; x <= PW - 8; x += 6) g.lineTo(x, 8 + J(x, 61));
  for (let y = 8; y <= PH - 8; y += 6) g.lineTo(PW - 8 + J(y, 62), y);
  for (let x = PW - 8; x >= 8; x -= 6) g.lineTo(x, PH - 8 + J(x, 63));
  for (let y = PH - 8; y >= 8; y -= 6) g.lineTo(8 + J(y, 64), y);
  g.closePath(); g.fill();
}
/* ---------- 米券 ---------- */
const TW = 320, TH = 380;
function buildTicket() {

  g.fillStyle = '#E6DCC4'; g.fillRect(0, 0, TW, TH);

    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rnd(i, 74) < .6 ? 'rgba(140,110,60,.06)' : 'rgba(255,250,235,.07)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }

  g.lineWidth = 1; g.strokeRect(21, 21, TW - 42, TH - 42);
  text(g, '堂岛 · 米切手', TW / 2, 64, `400 22px ${F_SONG}`, '#4A3A26', 'center', 1, 4);

  g.fillStyle = ed; g.fillRect(0, 0, TW, TH);

/* ---------- 梧桐树 (deterministic recursive branching) ---------- */
let TREE = [];
function buildTree() {
  TREE = [];
  const grow = (x, y, ang, len, w, depth, t0, id) => {
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    TREE.push({ x, y, x2, y2, w, depth, t0, leaf: depth >= 6 });
    if (depth >= 6) return;
    const n = depth < 2 ? 2 : (rnd(id, 81) < .45 ? 3 : 2);
    for (let k = 0; k < n; k++) {
      const spread = (n === 2 ? (k ? 1 : -1) * (0.32 + rnd(id * 3 + k, 82) * 0.22) : (k - 1) * 0.48) + (rnd(id * 5 + k, 83) - .5) * 0.18;
      grow(x2, y2, ang + spread, len * (0.7 + rnd(id * 7 + k, 84) * 0.12), w * 0.66, depth + 1, t0 + 7 + rnd(id + k, 85) * 3, id * 4 + k + 1);
    }
  };
  grow(960, 760, -Math.PI / 2, 150, 11, 0, 0, 1);
}

/* ---------------- shared stage pieces ---------------- */
function spot(g, x, floorY, w, a) {               // museum top light + pool on the floor
  if (a <= 0.01) return;
  g.save(); g.globalAlpha *= a;
  const cone = g.createLinearGradient(0, 0, 0, floorY);
  cone.addColorStop(0, 'rgba(255,226,170,0.07)'); cone.addColorStop(1, 'rgba(255,226,170,0.015)');
  g.fillStyle = cone; g.beginPath(); g.moveTo(x - w * 0.22, 0); g.lineTo(x + w * 0.22, 0); g.lineTo(x + w, floorY); g.lineTo(x - w, floorY); g.closePath(); g.fill();
  const pool = g.createRadialGradient(x, floorY, 0, x, floorY, w);
  pool.addColorStop(0, 'rgba(255,215,150,0.10)'); pool.addColorStop(1, 'rgba(255,215,150,0)');
  g.fillStyle = pool; g.save(); g.translate(x, floorY); g.scale(1, 0.16); g.translate(-x, -floorY); g.fillRect(x - w, floorY - w, 2 * w, 2 * w); g.restore();
  g.restore();
}
function floorShadow(g, x, y, rx, a) {
  if (a <= 0.01) return;
  g.save(); g.translate(x, y); g.scale(1, 0.14);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx); gr.addColorStop(0, `rgba(0,0,0,${0.55 * a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(-rx, -rx, 2 * rx, 2 * rx); g.restore();
}
function lightDot(g, x, y, r, a = 1) {
  g.save(); g.globalAlpha *= a;
  const gr = g.createRadialGradient(x, y, 0, x, y, r * 4); gr.addColorStop(0, 'rgba(232,200,122,.35)'); gr.addColorStop(1, 'rgba(232,200,122,0)');
  g.fillStyle = gr; g.fillRect(x - r * 4, y - r * 4, r * 8, r * 8);
  g.fillStyle = C.bright; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.restore();
}

/* ---------- 尘埃化（dust dissolve）: an object crumbles into drifting motes ---------- */
function dissolve(u, box, seed, draw, dir = null) {
  if (u <= 0) { draw(ctx); return; }
  if (u >= 1.3) return;
  const [bx, by, bw, bh] = box.map(Math.round);
  lctx.clearRect(bx, by, bw, bh);
  lctx.save(); draw(lctx); lctx.restore();
  const img = lctx.getImageData(bx, by, bw, bh), d = img.data;
  const nAt = (x, y) => {
    let n = NOISE[(clamp(y >> 2, 0, NH - 1)) * NW + clamp(x >> 2, 0, NW - 1)];
    if (dir) n = n * 0.55 + 0.45 * (dir.x ? (dir.x > 0 ? x / 1920 : 1 - x / 1920) : (dir.y > 0 ? y / 1080 : 1 - y / 1080));
    return n;
  };
  // motes sampled before the threshold eats the pixels
  const motes = [];
  for (let k = 0; k < 700; k++) {
    const px = bx + rnd(k, seed) * bw, py = by + rnd(k, seed + 1) * bh;
    const i = ((py - by | 0) * bw + (px - bx | 0)) * 4 + 3;
    if (d[i] > 60) motes.push([px, py, k]);
  }
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    const i = (y * bw + x) * 4; if (!d[i + 3]) continue;
    const n = nAt(bx + x, by + y);
    if (n < u) d[i + 3] = 0;
    else if (n < u + 0.035) { d[i] = Math.min(255, d[i] + 40); d[i + 1] = Math.min(255, d[i + 1] + 34); d[i + 2] = Math.min(255, d[i + 2] + 22); d[i + 3] *= 0.75; }
  }
  lctx.putImageData(img, bx, by);
  ctx.drawImage(LAYER, bx, by, bw, bh, bx, by, bw, bh);
  ctx.save();
  for (const [px, py, k] of motes) {
    const n = nAt(px | 0, py | 0); if (n >= u) continue;
    const age = (u - n) / 0.32; if (age >= 1) continue;
    const dx = (rnd(k, seed + 2) - .5) * 50 * age + (dir && dir.x ? dir.x * 40 * age : 0), dy = -age * (40 + rnd(k, seed + 3) * 50);
    ctx.fillStyle = `rgba(242,230,204,${(1 - age) * 0.55})`;
    const s = 1 + rnd(k, seed + 4) * 1.8; ctx.fillRect(px + dx, py + dy, s, s);
  }
  ctx.restore();
}

/* =====================================================================
   S0 · 0–210 · 钩子：一枚古银币
   ===================================================================== */
const COIN_X = 1240, COIN_Y = 440, COIN_R = 150, COIN_FLOOR = COIN_Y + COIN_R + 70;
const coinAng = f => (f * 0.4 - 84) * DEG;           // 自转 = 帧号 × 0.4°（相位让推轨时正面朝向镜头）
function sc0(f) {
  if (f >= 214) return;
  const g = ctx, fall = E(f, 36, 150), lit = E(f, 40, 140);
  let x = COIN_X, y = lerp(-260, COIN_Y, fall), r = COIN_R;
  if (f > 150) y += 6 * Math.sin((f - 150) / FPS * TAU * 0.35);
  const push = f < 182 ? 0 : inC(p(f, 182, 214)), pm = E(f, 182, 214);
  const sc = 1 + push * 12;
  x = lerp(x, 960, pm); y = lerp(y, 540, pm); r *= sc;
  spot(g, COIN_X, COIN_FLOOR, 280, lit * (1 - pm));

  g.strokeStyle = C.gold; g.lineWidth = 1.6; g.beginPath(); g.moveTo(220, 700); g.lineTo(f < 2186 ? lerp(220, 1700, E(f, 2160, 2186)) : 1560, 700); g.stroke();
  if (f >= 2176) {
    const k = E(f, 2176, 2204), a = { x: 1560, y: 700 }, c = { x: 1700, y: 700 }, b = { x: 1600, y: 560 };
    const pts = []; for (let i = 0; i <= 30; i++) pts.push(qbez(a, c, b, i / 30));
    if (f < 2186) { g.strokeStyle = rgba(C.gold, 1 - E(f, 2176, 2186)); g.beginPath(); g.moveTo(1560, 700); g.lineTo(lerp(1700, 1560, E(f, 2176, 2186)), 700); g.stroke(); }
    g.strokeStyle = C.gold; strokePartial(g, pts, k);
    if (k >= 1) { const an = Math.atan2(560 - 640, 1600 - 1665); g.beginPath(); g.moveTo(b.x - Math.cos(an - 0.5) * 12, b.y - Math.sin(an - 0.5) * 12); g.lineTo(b.x, b.y); g.lineTo(b.x - Math.cos(an + 0.5) * 12, b.y - Math.sin(an + 0.5) * 12); g.stroke(); }
  }
  NODES.forEach(([label, x], i) => {
    const t0 = 2178 + i * 5, fl = p(f, t0, t0 + 10), a = E(f, t0, t0 + 14);
    if (a <= 0) return;
    const r = fl < 1 ? lerp(0, 9, Math.sin(Math.PI * fl * 0.5)) * (fl > 0.5 ? lerp(1, 0.5, (fl - 0.5) * 2) : 1) : 4.5;
    lightDot(g, x, 700, Math.max(r, 3), a * (fl < 1 ? 1 : 0.9));
    text(g, label, x, 672, `400 24px ${F_PLAY}`, fl < 1 ? C.bright : C.gold, 'center', a);
  });
  // the coin returns (母题归位)
  const ca = E(f, 2196, 2238), cy = lerp(-160, 380, ca) + (f > 2238 ? 4 * Math.sin((f - 2238) / FPS * TAU * 0.35) : 0);
  if (ca > 0) { floorShadow(g, 960, BTN.y - BTN.h / 2 - 8, 110, ca * 0.6); drawCoin(g, 960, cy, 96, (f - 2280) * 0.4 * DEG, 0); }
  // 买入 key
  const ba = E(f, 2218, 2240), press = f >= 2289 ? 4 * (1 - E(f, 2296, 2316)) * clamp((f - 2288) / 2) : 0;
  if (ba > 0) {
    const y = BTN.y + 18 * (1 - ba) + press;
    g.save(); g.globalAlpha = ba;
    g.fillStyle = 'rgba(0,0,0,.35)'; rrect(g, BTN.x - BTN.w / 2 + 3, y - BTN.h / 2 + 6 - press, BTN.w, BTN.h, 14); g.fill();
    g.fillStyle = C.ivory; rrect(g, BTN.x - BTN.w / 2, y - BTN.h / 2, BTN.w, BTN.h, 14); g.fill();
    g.strokeStyle = C.gold; g.lineWidth = 2; g.stroke();
    text(g, '买入', BTN.x + 10, y + 10, `600 28px ${F_SONG}`, '#2A2117', 'center', 1, 6);
    const lit = f >= 2290;                              // 按键指示（全片第 3 处红）
    g.fillStyle = lit ? C.red : 'rgba(138,127,110,.5)'; g.beginPath(); g.arc(BTN.x - 54, y, 6, 0, TAU); g.fill();
    g.restore();
  }
  // fingertip light
  if (f >= 2262 && f < 2300) {
    const u = inOut(p(f, 2262, 2289)), q = qbez({ x: 1240, y: 300 }, { x: 1120, y: 560 }, { x: BTN.x + 30, y: BTN.y }, u);
    lightDot(g, q.x, q.y, 6 * (f > 2289 ? 1 - p(f, 2289, 2300) : 1));
  }
}

/* ---------------- UI: year block · document card · subtitles ---------------- */
const SCN = [
  { s: 210, year: [['公元前', 'cjk'], [' 1754', 'num']], place: '美索不达米亚 · 巴比伦', lat: 'Codex Hammurabi', cn: '《汉谟拉比法典》', meta: '汉谟拉比 · 巴比伦 · 约 1754 BC' },
  { s: 450, year: [['1602', 'num']], place: '荷兰 · 阿姆斯特丹', lat: 'Octrooi van de VOC', cn: '《东印度公司特许状》', meta: '荷兰议会 · 1602' },
  { s: 810, year: [['1730', 'num']], place: '日本 · 大阪 · 堂岛', lat: 'Dōjima Kome Kaisho', cn: '《堂岛米会所定目》', meta: '江户幕府认可 · 1730' },
  { s: 1170, year: [['1971', 'num']], place: '美国 · 华盛顿', lat: 'Smithsonian Agreement', cn: '《史密森协定》', meta: '尼克松冲击 · 1971' },
  { s: 1470, year: [['2009', 'num']], place: '点对点 · 无国界', lat: 'Bitcoin: A Peer-to-Peer Electronic Cash System', cn: '《比特币白皮书》', meta: '中本聪 · 2008' },
  { s: 1770, year: [['1792', 'num']], place: '美国 · 纽约', lat: 'Buttonwood Agreement', cn: '《梧桐树协议》', meta: '24 位经纪人 · 1792' },
  { s: 2160, year: [['2026', 'num']], place: '此刻 · 你', lat: 'Mandatum Emptionis', cn: '《你的买入单》', meta: '你 · 2026' },
];
const YEAR_X = 120, YEAR_BASE = 176, PLACE_BASE = 222, DOC_R = 1756;
function riseChar(g, ch, x, y, inU, outU, font, color, spacing = 0) {
  const a = inU * (1 - outU); if (a <= 0.003) return;
  const blur = 8 * (1 - inU) + 8 * outU;
  g.save(); g.font = font; g.fillStyle = color; g.globalAlpha = a; g.letterSpacing = spacing + 'px';
  if (blur > 0.05) g.filter = `blur(${blur.toFixed(2)}px)`;
  g.fillText(ch, x, y + 26 * (1 - inU) - 22 * outU); g.restore();
}
function drawYearBlocks(g, f) {
  SCN.forEach((S, k) => {
    const next = SCN[k + 1], s = S.s;
    if (f < s || (next && f > next.s + 24)) return;
    const outAt = next ? next.s - 2 : 1e9;
    // year (Play numerals, CJK prefix smaller on the same baseline)
    let x = YEAR_X, i = 0;
    for (const [str, kind] of S.year) {
      const font = kind === 'num' ? `400 110px ${F_PLAY}` : `400 60px ${F_SONG}`;
      g.font = font;
      for (const ch of str) {
        const inU = E(f, s + 8 + i * 2.5, s + 40 + i * 2.5), outU = E(f, outAt + i * 1.5, outAt + 14 + i * 1.5);
        riseChar(g, ch, x, YEAR_BASE, inU, outU, font, C.gold);
        g.font = font; x += g.measureText(ch).width + (kind === 'cjk' ? 4 : 0); i++;
      }
    }
    // place · person
    const pf = `400 30px ${F_SONG}`; g.font = pf; g.letterSpacing = '3px'; x = YEAR_X + 4;
    [...S.place].forEach((ch, j) => {
      const inU = E(f, s + 20 + j * 1.2, s + 46 + j * 1.2), outU = E(f, outAt + 4 + j * 0.6, outAt + 16 + j * 0.6);
      riseChar(g, ch, x, PLACE_BASE, inU, outU, pf, C.gray, 3); g.font = pf; g.letterSpacing = '3px'; x += g.measureText(ch).width;
    });
    g.letterSpacing = '0px';
    // document card (right aligned at the 120px safe line, seal outside the text)
    const lines = [[S.lat, `italic 400 26px ${F_PLAY}`, C.gray, 124, 16], [S.cn, `400 34px ${F_SONG}`, C.gold, 172, 22], [S.meta, `400 24px ${F_SONG}`, C.gray, 212, 28]];
    for (const [str, font, color, y, d] of lines) {
      const inU = E(f, s + d, s + d + 34), outU = E(f, outAt, outAt + 14);
      const a = inU * (1 - outU); if (a <= 0.003) continue;
      g.save(); g.globalAlpha = a; g.font = font; g.fillStyle = color; g.textAlign = 'right';
      const blur = 6 * (1 - inU) + 6 * outU; if (blur > 0.05) g.filter = `blur(${blur.toFixed(2)}px)`;
      g.fillText(str, DOC_R, y + 18 * (1 - inU) - 18 * outU); g.restore();
    }
    // 红章「文献」
    const st = E(f, s + 34, s + 46), so = E(f, outAt, outAt + 10);
    if (st > 0 && so < 1) {
      g.save(); g.translate(1786, 160); g.rotate(-6 * DEG); g.scale(lerp(1.5, 1, st) * (1 - so * 0.4), lerp(1.5, 1, st) * (1 - so * 0.4)); g.globalAlpha = clamp(st * 2) * (1 - so);
      g.fillStyle = C.red; g.fillRect(-14, -14, 28, 28);
      g.fillStyle = C.ivory; g.font = `600 11.5px ${F_SONG}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('文', 0, -6); g.fillText('献', 0, 7); g.restore();
    }
  });
}
const SUB = 56;
const SUBS = [
  [150, 206, '【价格】，从哪里来？'],
  [272, 352, '【现货】：一手交大麦，一手交银。'],
  [362, 444, '今天成交，今天两清。'],
  [604, 700, '6 份钱，凑成一艘船。'],
  [712, 806, '赚了按份分，亏了不到底——这就是【股票】。'],
  [884, 1004, '先定价，后交货——价格锁在春天，米在秋天进仓。'],
  [1014, 1150, '现货是今天两清；期货是今天定价，未来交割。这就是【期货】。'],
  [1240, 1330, '美元不再按固定价换黄金。'],
  [1344, 1456, '每种货币，开始互相称重——这就是【外汇】。'],
  [1532, 1612, '没有大楼，没有央行。'],
  [1624, 1762, '一本公开的账本，人人可查——这就是【加密货币】。'],
  [1846, 1932, '从 24 个人，到数亿个你。'],
  [1940, 2000, '看懂市场，先看懂谁在场：'],
  [2006, 2076, '跟风的【散户】，调动节奏的【主力】，'],
  [2082, 2156, '纪律齐整的【机构】，两头挂单的【做市商】。'],
  [2214, 2266, '你按下的每一次买入，'],
  [2270, 9999, '都站在这条 【400 年】的延长线上。'],
];
function drawSubtitles(g, f) {
  for (const [a, b, raw] of SUBS) {
    if (f < a || f > b + 2) continue;
    const chars = []; let key = false;
    for (const ch of raw) { if (ch === '【') { key = true; continue; } if (ch === '】') { key = false; continue; } chars.push({ ch, key }); }
    let w = 0;
    for (const c of chars) { g.font = c.key ? `600 ${SUB * 1.3}px ${F_SONG}` : `400 ${SUB}px ${F_SONG}`; c.w = g.measureText(c.ch).width; w += c.w; }
    let x = 960 - w / 2, n = 0;
    for (const c of chars) {
      const t0 = a + n * 1.2;                         // 每字 40ms
      const inU = E(f, t0, t0 + 16), outU = b > 9000 ? 0 : E(f, b - 14 + n * 0.4, b - 4 + n * 0.4);
      const al = inU * (1 - outU);
      if (al > 0.003 && c.ch !== ' ') {
        g.save(); g.globalAlpha = al; g.font = c.key ? `600 ${SUB * 1.3}px ${F_SONG}` : `400 ${SUB}px ${F_SONG}`;
        g.fillStyle = c.key ? C.bright : C.ivory;
        const bl = 6 * (1 - inU) + 6 * outU; if (bl > 0.05) g.filter = `blur(${bl.toFixed(2)}px)`;
        g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 12;
        g.fillText(c.ch, x, SUBTITLE_Y + 10 * (1 - inU) - 8 * outU); g.restore();
      }
      x += c.w; n++;
    }
  }
}


/* ---------- 开场标题：落在硬币左侧的留白里，帧 34–148 ---------- */
const TITLE = { x: 600, y: 520 };
function drawTitle(g, f) {
  if (f < 30 || f > 150) return;
  const outAt = 132;
  // latin line
  const la = E(f, 40, 76) * (1 - E(f, outAt, outAt + 14));
  if (la > 0.003) {
    g.save(); g.globalAlpha = la; g.font = `italic 400 26px ${F_PLAY}`; g.fillStyle = C.gray; g.textAlign = 'center'; g.letterSpacing = '10px';
    const b = 6 * (1 - E(f, 40, 76)) + 6 * E(f, outAt, outAt + 14); if (b > 0.05) g.filter = `blur(${b.toFixed(2)}px)`;
    g.fillText('DE MERCATIBUS', TITLE.x + 5, TITLE.y - 118 + 10 * (1 - la)); g.restore();
  }
  // title, character by character
  const s = '认识交易市场', font = `600 104px ${F_SONG}`;
  g.save(); g.font = font; g.letterSpacing = '18px';
  const ws = [...s].map(ch => g.measureText(ch).width), tot = ws.reduce((a, b) => a + b, 0);
  g.restore();
  let x = TITLE.x - tot / 2 + 9;
  [...s].forEach((ch, i) => {
    const inU = E(f, 48 + i * 4, 84 + i * 4), outU = E(f, outAt + i * 1.5, outAt + 12 + i * 1.5);
    const a = inU * (1 - outU);
    if (a > 0.003) {
      g.save(); g.globalAlpha = a; g.font = font;
      const gr = g.createLinearGradient(0, TITLE.y - 90, 0, TITLE.y + 10);
      gr.addColorStop(0, '#F0D795'); gr.addColorStop(.55, C.gold); gr.addColorStop(1, '#9C7C42');
      g.fillStyle = gr; const b = 8 * (1 - inU) + 8 * outU; if (b > 0.05) g.filter = `blur(${b.toFixed(2)}px)`;
      g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 18;
      g.fillText(ch, x, TITLE.y + 16 * (1 - inU) - 14 * outU); g.restore();
    }
    x += ws[i];
  });
  // hairline rule with a small diamond, drawn outward from the centre
  const rk = E(f, 70, 104) * (1 - E(f, outAt, outAt + 12)), ry = TITLE.y + 56;
  if (rk > 0.003) {
    g.save(); g.globalAlpha = rk; g.strokeStyle = rgba(C.gold, .7); g.lineWidth = 1;
    g.beginPath(); g.moveTo(TITLE.x - 18, ry); g.lineTo(TITLE.x - 18 - 230 * rk, ry); g.moveTo(TITLE.x + 18, ry); g.lineTo(TITLE.x + 18 + 230 * rk, ry); g.stroke();
    g.fillStyle = C.gold; g.translate(TITLE.x, ry); g.rotate(Math.PI / 4); g.fillRect(-4, -4, 8, 8); g.restore();
  }
  const sa = E(f, 84, 116) * (1 - E(f, outAt, outAt + 14));
  if (sa > 0.003) text(g, '一部交易的编年史', TITLE.x, ry + 52, `400 28px ${F_SONG}`, C.gray, 'center', sa, 8);
}

/* ---------------- dust ---------------- */
function drawDust(g, f) {
  const t = f / FPS, amb = E(f, 2, 40);
  for (let i = 0; i < DUST_COUNT; i++) {
    const ang = rnd(i, 1) * TAU, sp = 2 + rnd(i, 2) * 2;                  // 2–4 px/s
    let x = (rnd(i, 3) * 1920 + Math.cos(ang) * sp * t + Math.sin(t * 0.3 + i) * 3) % 1920; if (x < 0) x += 1920;
    let y = (rnd(i, 4) * 1080 + Math.sin(ang) * sp * t - t * 1.2) % 1080; if (y < 0) y += 1080;
    const a = (0.08 + 0.10 * (0.5 + 0.5 * Math.sin(t * (0.6 + rnd(i, 5) * 1.4) + rnd(i, 6) * TAU))) * amb;
    const s = 1 + rnd(i, 7) * 2;
    g.fillStyle = `rgba(242,230,204,${a.toFixed(3)})`; g.beginPath(); g.arc(x, y, s / 2, 0, TAU); g.fill();
  }
}

/* ---------------- frame ---------------- */
function seek(f) {
  f = Math.max(0, Math.min(TOTAL_FRAMES - 1, Math.round(f)));
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none'; g.globalCompositeOperation = 'source-over';
  // room
  g.fillStyle = C.bg; g.fillRect(0, 0, 1920, 1080);
  const room = E(f, 30, 110);
  if (room > 0) { const gr = g.createRadialGradient(960, 520, 0, 960, 520, 980); gr.addColorStop(0, rgba(C.glow, room)); gr.addColorStop(1, rgba(C.glow, 0)); g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080); }
  // exhibits
  if (f < 214) sc0(f);
  if (f >= 214 && f < 466) sc1(f);
  if (f >= 448 && f < 850) sc2(f);
  if (f >= 826 && f < 1190) sc3(f);
  if (f >= 1184 && f < 1500) sc4(f);
  if (f >= 1478 && f < 1810) sc5(f);
  if (f >= 1800 && f < 2190) sc6(f);
  if (f >= 2160) sc7(f);
  drawDust(g, f);
  g.drawImage(VIGNETTE, 0, 0);
  // UI
  g.save(); g.globalAlpha = 0.62 * E(f, 40, 100);
  g.drawImage(LOGO, 120, 36, 30 * LOGO.width / LOGO.height, 30); g.restore();   // TradingNow 水印
  if (SHOW_TITLE) drawTitle(g, f);
  drawYearBlocks(g, f);
  drawSubtitles(g, f);
  // the single full-screen glint (S7 key press, 0.3s)
  if (f >= 2289 && f < 2299) { g.fillStyle = `rgba(232,200,122,${(0.16 * Math.sin(Math.PI * (f - 2289) / 9)).toFixed(3)})`; g.fillRect(0, 0, 1920, 1080); }
  // grain
  g.save(); g.globalAlpha = GRAIN_OPACITY; const tile = GRAIN[f % 4], ox = Math.floor(rnd(f, 991) * 960), oy = Math.floor(rnd(f, 992) * 540);
  g.translate(-ox, -oy); for (let y = 0; y < 2; y++) for (let x = 0; x < 3; x++) g.drawImage(tile, x * 960, y * 540); g.restore();
  // the only two black moments: open from black, close to black
  if (f < 30) { g.fillStyle = `rgba(0,0,0,${(0.55 * (1 - f / 30)).toFixed(3)})`; g.fillRect(0, 0, 1920, 1080); }
  if (f >= 2280) { g.fillStyle = `rgba(0,0,0,${Math.pow(p(f, 2280, 2339), 1.4).toFixed(3)})`; g.fillRect(0, 0, 1920, 1080); }
  if (f >= 2270) text(g, '本片仅为知识科普，不构成任何投资建议', 960, 934, `400 24px ${F_SONG}`, C.gray, 'center', p(f, 2270, 2280), 2);
  return f;
}

/* ---------------- boot ---------------- */
window.TOTAL_FRAMES = TOTAL_FRAMES;
window.seek = seek;
window.READY = (async () => {
  LOGO = new Image(); await new Promise((res, rej) => { LOGO.onload = res; LOGO.onerror = rej; LOGO.src = 'assets/tradingnow-logo.png'; });   // onload, not decode(): decode() stalls in background tabs
  await Promise.all([...document.fonts].map(ff => ff.load()));   // every unicode-range slice, not just the first glyphs
  await document.fonts.ready;
  buildStatic(); buildPen();
  seek(0);
  return true;
})();
