<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ================= 可调参数 ================= */
const CANVAS        = { W: 1920, H: 1080 };   // 横版 16:9（竖版改 1080×1920，安全区改底部 300px，时间轴与链条构图转为纵向）
const SAFE_MARGIN   = { X: 120, B: 140 };     // 左右 120 / 下沿 140
const FPS           = 30;
const TOTAL_FRAMES  = 2340;                   // 78 秒。不要压缩：不许删知识点、不许删幕
const DUST_COUNT    = 100;
const GRAIN_OPACITY = 0.05;
const SUBTITLE_Y    = 880;
const RED_BUDGET    = 6;                      // 红色出现次数上限，超了就是错
/* ============================================ */

const W = CANVAS.W, H = CANVAS.H, RX = W - SAFE_MARGIN.X;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const C = {
  bg: '#0E0B08', glow: '#1A140C', ivory: '#E8DFC8', gold: '#C8A96A', bright: '#E8C87A', gray: '#8A7F6E', red: '#A03A2E',
  ink: '#3B2E20', inkSoft: '#6B5A44', brass: '#A9875A', brassHi: '#D8BC86', brassLo: '#6A5232', silver: '#B9B3A7', goldDeep: '#8E7442',
};
const FONT = {
  song: "'Song','SongJP',serif", songB: "'SongB','Song','SongJP',serif",
  num: "'Play','Song','SongJP',serif", ital: "'GaraI',serif", gara: "'Gara',serif",
};

/* ---------- red budget ledger: every red draw registers its id ---------- */
const RED = new Set();
const red = id => { RED.add(id); return C.red; };
window.redUsage = () => [...RED];

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (f, a, b) => clamp((f - a) / (b - a));
function cubicBezier(x1, y1, x2, y2) {
  const bx = t => 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3;
  const by = t => 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;

  if (mf > 0) { ctx.save(); ctx.globalAlpha = mf * (fo === 'main' ? 0.3 : 0.12); ctx.strokeStyle = C.gold; ctx.setLineDash([3, 7]); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(M[0], M[1], 150, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
  // 做市商的报价细线：间距 = 点差
  const mm = dots.filter(d => d.role === 'mm'), mmA = prog(f, 1950, 1975) * (1 - conv);
  if (mmA > 0) {
    const a = mmA * (fo === 'mm' ? 1 : fo ? 0.45 : 0.75);
    line(mm[0].x - 10, 540, mm[0].x - 120, 540, 1.2, C.gold, a); line(mm[1].x + 10, 540, mm[1].x + 120, 540, 1.2, C.gold, a);
    line(mm[0].x, 556, mm[1].x, 556, 0.8, C.gray, a); line(mm[0].x, 551, mm[0].x, 561, 0.8, C.gray, a); line(mm[1].x, 551, mm[1].x, 561, 0.8, C.gray, a);
    ctx.save(); ctx.globalAlpha = a; ctx.font = `400 18px ${FONT.song}`; ctx.fillStyle = C.gray; ctx.textAlign = 'center';
    ctx.fillText('买价', mm[0].x - 96, 528); ctx.fillText('卖价', mm[1].x + 96, 528); ctx.fillText('点差', 960, 582); ctx.restore();
  }
  dots.forEach((d, i) => {
    let x = d.x, y = d.y, r = d.r;
    if (conv > 0) { x = lerp(x, T[i], conv); y = lerp(y, 540, conv) - 30 * Math.sin(Math.PI * conv); r = lerp(r, 2.2, conv) * (1 - prog(f, 2156, 2176)); }
    dot(x, y, r, d.col, d.a);
    if (d.role === 'main' && conv < 1) halo(x, y, 46, C.bright, 0.12 * d.a * (1 - conv));
  });
  // 身份标签（被字幕点名时浮现）
  const lab = (s, x, y, st) => animText(s, x, y, { size: 22, color: C.ivory, align: 'center', start: st, exit: 2120, alpha: 0.85 });
  lab('散户', 1560, 300, 1986); lab('主力', M[0], M[1] - 44, 2008);
  const O = instOrigin(f); lab('机构', O[0] + 51, O[1] - 24, 2064); lab('做市商', 960, 616, 2094);
}

/* =====================================================================
   S7 · 2026 · 此刻 · 你
   ===================================================================== */
const NODES = [['前 1754', 300], ['1602', 560], ['1730', 820], ['1971', 1080], ['2009', 1340]];
function sceneNow(f) {
  if (f < 2146) return;
  const Ly = 540 + 220 * io(f, 2205, 2238);
  const half = 780 * EXPO(prog(f, 2146, 2172)), cl = io(f, 2222, 2248);
  const xR = lerp(960 + half, 1380, cl);
  line(960 - half, Ly, xR, Ly, 1.4, C.gold);
  if (cl > 0) {
    const curl = Array.from({ length: 31 }, (_, i) => qbez([1380, Ly], [1512, Ly], [1490, Ly - 130], i / 30));
    const vis = subPoly(curl, 0, cl); strokePts(vis, 1.4, C.gold);
    if (cl > 0.95) { const e = vis[vis.length - 1]; line(e[0], e[1], e[0] - 8, e[1] + 9, 1.4, C.gold); line(e[0], e[1], e[0] + 9, e[1] + 6, 1.4, C.gold); }
  }
  NODES.forEach(([lab, x], k) => {
    const t = 2168 + k * 8; if (f < t) return;
    const fl = bump(f, t, t + 12), r = 3 + 5 * fl + ex(f, t, 8);
    dot(x, Ly, r, C.bright); halo(x, Ly, 22, C.bright, 0.25 * fl);
    const a = ex(f, t, 12) * lerp(1, 0.55, prog(f, t + 12, t + 26));
    tabText(lab, x, Ly + 42, 24, FONT.num, C.gold, 'center', a);
  });
  // 母题归位：S0 的银币
  const cp = ex(f, 2212, 34);
  if (cp > 0) {
    topLight(960, 640, 520, cp);
    drawCoin(ctx, 960, 382 - 4 * Math.sin((f - 2212) * 0.06), 0.6 * cp, f * 0.4 * Math.PI / 180, 0.35 * Math.sin(f * 0.021) * cp + (1 - cp) * 1.2, 1, Math.min(1, cp * 1.5));
  }
  // 买入键
  const bp = io(f, 2226, 2254);
  if (bp > 0) {
    const press = 3 * bump(f, 2290, 2300), bx = 960, by = 604 + press;
    const per = [[bx - 106, by - 36], [bx + 106, by - 36], [bx + 120, by - 22], [bx + 120, by + 22], [bx + 106, by + 36], [bx - 106, by + 36], [bx - 120, by + 22], [bx - 120, by - 22], [bx - 106, by - 36]];
    ctx.save(); ctx.globalAlpha = prog(bp, 0.5, 1); ctx.beginPath(); ctx.roundRect(bx - 120, by - 36, 240, 72, 14); ctx.fillStyle = C.ivory; ctx.fill(); ctx.restore();
    if (bp < 1) strokePts(subPoly(per, 0, bp), 2, C.gold); else { ctx.save(); ctx.beginPath(); ctx.roundRect(bx - 120, by - 36, 240, 72, 14); ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
    animText('买入', bx + 8, by + 10, { size: 28, fam: FONT.songB, wt: 600, color: '#2A2118', align: 'center', start: 2244, stagger: 3 });
    // 按键指示灯：按下后亮红（全片第 3 种红）
    const on = f >= 2290;
    dot(bx - 82, by, 5, on ? red('buy-indicator') : '#B8AD94', prog(bp, 0.6, 1));
  }
  // 指尖光点落下
  if (f >= 2266 && f < 2292) { const t = io(f, 2266, 2290), p = qbez([1250, 300], [1120, 560], [970, 604], t); dot(p[0], p[1], 7, '#F6EEDA', 1 - prog(f, 2288, 2292)); halo(p[0], p[1], 30, C.bright, 0.22); }
}

/* =====================================================================
   帧合成
   ===================================================================== */
function render(f) {
  F = f; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBG(f < 210 ? io(f, 30, 130) : 1);
  sceneCoin(f); sceneBalance(f); sceneVOC(f); sceneDojima(f); sceneChain(f); scenePaper(f); sceneHall(f); sceneNow(f);
  vignette();
  drawHeader(f); drawSubs(f);
  dust(f);
  // 全片唯一一次金光微闪（0.3s）
  const fl = bump(f, 2290, 2299); if (fl > 0) { ctx.fillStyle = rgba(C.bright, 0.13 * fl); ctx.fillRect(0, 0, W, H); }
  grain(f);
  // 收黑（帧 2280 → 2340），免责声明持续可见
  const bk = io(f, 2280, 2339); if (bk > 0) { ctx.fillStyle = `rgba(0,0,0,${bk})`; ctx.fillRect(0, 0, W, H); }
  if (f >= 2272) animText('本片仅为知识科普，不构成任何投资建议', 960, 932, { size: 24, color: C.gray, align: 'center', start: 2270, stagger: 0.2, dur: 10 });
}
window.TOTAL_FRAMES = TOTAL_FRAMES;
window.FPS = FPS;
window.seek = f => { render(Math.max(0, Math.min(TOTAL_FRAMES - 1, Math.round(f)))); return true; };
window.ASSETS_READY = Promise.all([
  document.fonts.load(`400 58px Song`, '价'), document.fonts.load(`600 58px SongB`, '价'), document.fonts.load(`400 58px SongJP`, '匁'),
  document.fonts.load(`400 110px Play`, '1602'), document.fonts.load(`italic 400 26px GaraI`, 'Octrooi'), document.fonts.load(`400 26px Gara`, 'VOC'),
]).then(() => document.fonts.ready).then(() => { buildCoin(); buildGrain(); window.seek(0); });
</script>
