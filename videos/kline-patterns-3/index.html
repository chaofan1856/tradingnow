<canvas id="c" width="2560" height="1440"></canvas>
<img id="logo" src="assets/logo.png" alt="" hidden>

<!-- ============================================================
     ENGINE — TradingNow knowledge-film style.
     Everything is drawn on one canvas in 1920×1080 logical units at 2× (= 4K).
     Every pixel is a pure function of the frame number: no Date, no Math.random,
     no CSS animation — so any frame can be rendered by any worker in any order.
     Content lives in script.js (window.FILM); this file is the reusable style.
     ============================================================ -->
<script>
'use strict';
const W = 1920, H = 1080, SCALE = 4 / 3, FPS = 60;   // 2K master (2560×1440)

/* ---------- palette (the house style) ---------- */
const C = {
  bg: '#08080A',
  white: '#ECE6D9',          // warm paper white for body text
  gray: '#8C8578',           // secondary labels
  dim: '#4A463F',            // rules, ticks
  gold: '#C9A25A',           // accents
  goldHi: '#F1D597',         // highlights / glows
  goldDeep: '#8A6A2E',
  red: '#E5484D',            // 阳线 (China: red = up)
  green: '#1FA36A',          // 阴线 (China: green = down)
  brand: '#D2C3A8',          // watermark
};

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const expo = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(c, a = 1) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }
function mix(c1, c2, t) { const a = hex(c1), b = hex(c2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], clamp(t))).toString(16).padStart(2, '0')).join(''); }

/* ---------- fonts ---------- */
// Every on-screen text size is multiplied by FS so subtitles and labels read on a phone.
// The watermark (brand) is deliberately NOT scaled. A film may override with FILM.fontScale.
const FS = () => (window.FILM && window.FILM.fontScale) || 1.75;
const F = {
  serif: (w, s) => `${w} ${(s * FS()).toFixed(1)}px SerifSC, LatinSerif, serif`,
  latin: (w, s) => `${w} ${(s * FS()).toFixed(1)}px LatinSerif, SerifSC, serif`,
  mono: s => `300 ${(s * FS()).toFixed(1)}px MonoL, monospace`,
  brand: s => `600 ${s}px BrandSans, sans-serif`,
};

/* ============================================================
   KIT — drawing primitives available to script.js as `K`
   ============================================================ */
const K = {
  C, clamp, lerp, easeOut, easeInOut, expo, rng, rgba, mix, W, H,

  /** plain text. o: {font, color, alpha, align, spacing(px), glow} */
  text(ctx, str, x, y, o = {}) {
    if ((o.alpha ?? 1) <= 0.001) return;
    ctx.save();
    ctx.globalAlpha *= o.alpha ?? 1;
    ctx.font = o.font || F.serif(500, 24);
    ctx.fillStyle = o.color || C.white;
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'alphabetic';
    if (o.spacing) ctx.letterSpacing = o.spacing + 'px';
    if (o.glow) { ctx.shadowColor = rgba(o.glowColor || C.gold, o.glow); ctx.shadowBlur = 18; }
    ctx.fillText(str, x, y);
    ctx.restore();
  },

  /** gold-gradient display text (titles). */
  goldText(ctx, str, x, y, size, o = {}) {
    ctx.save();
    ctx.globalAlpha *= o.alpha ?? 1;
    ctx.font = F.serif(o.weight || 900, size);
    ctx.textAlign = o.align || 'center';
    if (o.spacing) ctx.letterSpacing = o.spacing + 'px';
    const g = ctx.createLinearGradient(0, y - size * .9, 0, y + size * .15);
    g.addColorStop(0, '#FBEBC0'); g.addColorStop(.45, '#E2BE73'); g.addColorStop(.7, '#B8893C'); g.addColorStop(1, '#7A5A24');
    ctx.shadowColor = rgba(C.gold, .35 * (o.glow ?? 1)); ctx.shadowBlur = 40;
    ctx.fillStyle = g; ctx.fillText(str, x, y);
    ctx.restore();
  },

  /** rich subtitle markup: {gold}  [red]  <green> ; reveal is per-character.
   *  o: {size, weight, x, y, maxW, lh, align, t (seconds since line start), out (0..1 fade-out), stagger} */
  rich(ctx, markup, o) {
    const size = o.size || 42, weight = o.weight || 700, lh = o.lh || size * FS() * 1.32;
    ctx.save();
    ctx.font = F.serif(weight, size);
    const chars = [];
    let col = C.white;
    for (const ch of markup) {
      if (ch === '{') { col = C.goldHi; continue; } if (ch === '}') { col = C.white; continue; }
      if (ch === '[') { col = C.red; continue; } if (ch === ']') { col = C.white; continue; }
      if (ch === '<') { col = C.green; continue; } if (ch === '>') { col = C.white; continue; }
      chars.push({ ch, col, w: ctx.measureText(ch).width });
    }
    // wrap (never start a line with closing punctuation)
    const lines = [[]]; let lw = 0; const maxW = o.maxW || 1480;
    const word = ch => /[A-Za-z0-9.%$'-]/.test(ch);
    for (const c of chars) {
      if (lw + c.w > maxW && !'，。、：；！？）」』—'.includes(c.ch)) {
        const cur = lines[lines.length - 1];
        let k = cur.length;                                  // never split an English word / number: carry it to the next line
        if (word(c.ch)) while (k > 0 && word(cur[k - 1].ch)) k--;
        const carry = k > 0 && k < cur.length ? cur.splice(k) : [];
        lines.push(carry); lw = carry.reduce((s, x) => s + x.w, 0);
      }
      lines[lines.length - 1].push(c); lw += c.w;
    }
    const total = lines.length, stagger = o.stagger ?? 0.022, t = o.t ?? 99, out = clamp(o.out ?? 0);
    let k = 0;
    lines.forEach((ln, li) => {
      const width = ln.reduce((s, c) => s + c.w, 0);
      let x = o.align === 'center' ? o.x - width / 2 : o.x;
      const y = o.anchorTop ? o.y + li * lh : o.y - (total - 1 - li) * lh;   // default: the last line sits on o.y

        const a = p * (1 - out);

          ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3;

  /** one candlestick. k:{o,h,l,c} in price; y(): price→px. o:{w, alpha, color, glow, grow(0..1)} */
  candle(ctx, x, k, y, o = {}) {

  /** dotted path (the house "particle line"). pts: [[x,y]...], p: draw progress 0..1 */
  dotted(ctx, pts, p = 1, o = {}) {

    const seg = []; let L = 0;

  dash(ctx, x1, y1, x2, y2, o = {}) {

    ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
    ctx.strokeStyle = o.color || C.gold; ctx.lineWidth = o.width || 1.4; ctx.setLineDash(o.dash || [8, 7]);

  /** solid hairline with optional progress (from start) */
  line(ctx, x1, y1, x2, y2, o = {}) {
    const p = clamp(o.p ?? 1); if (p <= 0) return;
    ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
    ctx.strokeStyle = o.color || C.gold; ctx.lineWidth = o.width || 1.2;

  /** gold rule that grows from the centre, with a bright dot (chapter / title cards) */
  rule(ctx, cx, y, half, p, o = {}) {

  arrow(ctx, x1, y1, x2, y2, o = {}) {

  /** ring marker with label. o:{alpha, color, label, sub, pos:'above'|'below'|'left'|'right', r, pulse} */
  marker(ctx, x, y, o = {}) {

      K.text(ctx, o.label, lx, ly, { font: o.font || F.serif(700, 22), color: o.labelColor || col, align: al });
      if (o.sub) K.text(ctx, o.sub, lx, ly + (pos === 'above' ? -26 : 24), { font: F.latin(500, 17), color: C.gray, align: al, spacing: 1 });

    if (o.sub) K.text(ctx, o.sub, cx, y - (up ? 16 + 30 * FS() : -32 - 30 * FS()), { font: F.latin(500, 18), color: C.gray, align: 'center', spacing: 1, alpha: (o.alpha ?? 1) * clamp((o.p ?? 1) * 2 - 1) });
  },

  /** vertical brace on the right of [y1,y2] at x with label */
  vbrace(ctx, x, y1, y2, label, o = {}) {

  tag(ctx, x, y, str, o = {}) {

K.F = F;

/* ---------- candle data generators ---------- */
K.gen = {
  /** price walk through waypoints. per: candles per leg (number or array). Returns {candles, swings:[{i,price,type:'H'|'L'}]} */
  path(wps, o = {}) {
    const R = rng(o.seed || 7), noise = o.noise ?? .45, wick = o.wick ?? .55, out = [], swings = [];
    let price = wps[0];
    for (let k = 0; k < wps.length - 1; k++) {
      const from = wps[k], to = wps[k + 1], n = Array.isArray(o.per) ? o.per[k] : (o.per || 5), step = (to - from) / n;
      for (let j = 0; j < n; j++) {
        const target = from + step * (j + 1);
        const o_ = price;
        let c = j === n - 1 ? to : target + (R() - .5) * noise * Math.abs(step) * 2;
        const hiW = R() * wick * Math.abs(step), loW = R() * wick * Math.abs(step);
        let h = Math.max(o_, c) + hiW, l = Math.min(o_, c) - loW;
        if (j === n - 1) { if (to > from) h = Math.max(h, to + Math.abs(step) * .25); else l = Math.min(l, to - Math.abs(step) * .25); }
        out.push({ o: o_, h, l, c });

      }
      swings.push({ i: out.length - 1, price: to > from ? out[out.length - 1].h : out[out.length - 1].l, type: to > from ? 'H' : 'L' });

  },
  /** explicit sequence: list of [bodyDelta, upperWick, lowerWick] (delta>0 → 阳线) */
  seq(start, list) {
    let p = start; const out = [];
    for (const [d, wu, wl] of list) { const o = p, c = p + d; out.push({ o, c, h: Math.max(o, c) + (wu ?? .2), l: Math.min(o, c) - (wl ?? .2) }); p = c; }
    return out;
  },

/** candle chart in a box. new K.Chart(candles, {x,y,w,h}, {pad, gap}) */
K.Chart = class {
  constructor(candles, box, o = {}) {
    this.k = candles; this.box = box;
    let lo = Infinity, hi = -Infinity; for (const c of candles) { lo = Math.min(lo, c.l); hi = Math.max(hi, c.h); }
    const pad = (hi - lo) * (o.pad ?? .08); this.lo = o.lo ?? lo - pad; this.hi = o.hi ?? hi + pad;

  y(p) { return this.box.y + this.box.h * (1 - (p - this.lo) / (this.hi - this.lo)); }

  draw(ctx, reveal, o = {}) {
    const yf = p => this.y(p);
    for (let i = 0; i < this.k.length && i < Math.ceil(reveal); i++) {
      const g = clamp(reveal - i);
      const a = (o.alpha ?? 1) * (o.dim ? o.dim(i) : 1);
      K.candle(ctx, this.x(i), this.k[i], yf, { w: this.cw, grow: g, alpha: a, glow: o.glow ?? .35, color: o.color ? o.color(i) : undefined });
    }
  }
};

/* ---------- brand watermark (TN mark + wordmark) — always top-left ---------- */
function drawWatermark(ctx, x, y, s, alpha) {             // the channel's own logo (assets/logo.png), never redrawn
  const L = document.getElementById('logo');
  if (!L || !L.naturalWidth) return;
  const h = s * 1.2, w = h * L.naturalWidth / L.naturalHeight;
  ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(L, x, y, w, h); ctx.restore();
}
K.watermark = drawWatermark;

<script>
'use strict';
/* ============================================================
   TIMELINE — built from FILM.scenes. Subtitle lines drive the clock:
   each line gets  max(minLine, chars × perChar + base)  seconds.
   ============================================================ */
const FILM = window.FILM;
const CFG = Object.assign({ perChar: 0.13, base: 0.95, minLine: 2.2, pre: 0.7, post: 0.6 }, FILM.timing || {});
const plain = s => s.replace(/[{}\[\]<>]/g, '');
const lineDur = l => typeof l === 'object' ? l.d : Math.max(CFG.minLine, plain(l).length * CFG.perChar + CFG.base);
const lineText = l => typeof l === 'object' ? l.s : l;

let T = 0;
const SC = FILM.scenes.map((s, idx) => {
  const lines = s.lines || [];
  const beats = []; let tt = s.pre ?? CFG.pre;
  for (const l of lines) { beats.push(tt); tt += lineDur(l); }
  const dur = s.dur ?? tt + (s.post ?? CFG.post);
  const sc = { ...s, idx, lines, beats, dur, start: T, end: T + dur };
  T += dur;
  return sc;
});
const TOTAL = Math.round(T * FPS);
window.TOTAL_FRAMES = TOTAL;
window.TIMELINE = SC.map(s => ({ id: s.id, type: s.type || 'scene', start: +s.start.toFixed(3), dur: +s.dur.toFixed(3), f0: Math.round(s.start * FPS), f1: Math.round(s.end * FPS) }));

/* ---------- static layers ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const BG = (() => {                                // background: grained black — mottled, fine film grain, sparse specks, warm centre, vignette
  const PW = W * SCALE, PH = H * SCALE;
  const c = document.createElement('canvas'); c.width = PW; c.height = PH;
  const x = c.getContext('2d');
  const img = x.createImageData(PW, PH), d = img.data, R = rng(1990);
  const vn = (seed, cell) => {                      // smooth value noise on a grid of `cell` px
    const r = rng(seed), gw = Math.ceil(PW / cell) + 2, gh = Math.ceil(PH / cell) + 2, g = Float32Array.from({ length: gw * gh }, r), sm = t => t * t * (3 - 2 * t);
    return (px, py) => { const gx = px / cell, gy = py / cell, ix = gx | 0, iy = gy | 0, fx = sm(gx - ix), fy = sm(gy - iy), i = iy * gw + ix;
      return lerp(lerp(g[i], g[i + 1], fx), lerp(g[i + gw], g[i + gw + 1], fx), fy); };
  };
  const m1 = vn(3, 900), m2 = vn(4, 260), m3 = vn(5, 70);

    const mot = (m1(px, py) - .5) * 9 + (m2(px, py) - .5) * 6 + (m3(px, py) - .5) * 3;   // worn, stone-like mottling
    const gr = (R() + R() + R() - 1.5) * 9;                                                 // fine monochrome grain (≈gaussian)
    const sp = R() < .0012 ? 14 + R() * 30 : 0;                                              // sparse bright specks
    const v = 11 + mot + gr + sp, i = (py * PW + px) * 4;
    d[i] = v * 1.06; d[i + 1] = v * .98; d[i + 2] = v * .86; d[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  x.scale(SCALE, SCALE);
  x.globalCompositeOperation = 'lighter';
  const g = x.createRadialGradient(W * .5, H * .42, 0, W * .5, H * .42, W * .62);
  g.addColorStop(0, 'rgba(46,36,20,.55)'); g.addColorStop(.5, 'rgba(20,15,8,.3)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(201,162,90,.035)';            // faint dot grid
  for (let yy = 30; yy < H; yy += 40) for (let xx = 30; xx < W; xx += 40) { x.beginPath(); x.arc(xx, yy, .9, 0, 6.2832); x.fill(); }

  const v = x.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.72)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);

})();

/* ---------- atmosphere: slow light beams + drifting bokeh (drawn every frame, under the scene) ---------- */
const BOKEH = (() => { const R = rng(606), a = []; for (let i = 0; i < 16; i++) a.push({ x: R() * W, y: R() * H, r: 60 + R() * 150, a: .025 + R() * .045, ph: R() * 6.28, sp: .04 + R() * .08 }); return a; })();
function drawAtmosphere(time) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {                          // out-of-focus gold lights
    const x = (b.x + Math.sin(time * b.sp + b.ph) * 120 + time * 4) % (W + 300) - 150, y = b.y + Math.cos(time * b.sp * .8 + b.ph) * 70;
    const a = b.a * (.6 + .4 * Math.sin(time * .5 + b.ph));
    const g = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    g.addColorStop(0, rgba(C.goldHi, a)); g.addColorStop(.55, rgba(C.gold, a * .45)); g.addColorStop(1, rgba(C.gold, 0));
    ctx.fillStyle = g; ctx.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2);
  }

    ctx.fillStyle = g; ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(0, -wdt * .2); ctx.lineTo(2600, -wdt); ctx.lineTo(2600, wdt); ctx.lineTo(0, wdt * .2); ctx.fill();
    ctx.restore();
  }

}

/* ---------- header (top-left module tag + top-right reference) ---------- */
function drawHeader(h, a, dy = 0) {
  if (!h || a <= 0.002) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, dy);
  ctx.font = F.serif(500, 30); ctx.fillStyle = C.white; ctx.fillText(h.label || '模块', 120, 152);
  const lw = ctx.measureText(h.label || '模块').width;
  if (h.num != null) K.goldText(ctx, String(h.num), 120 + lw + 14, 157, 52, { align: 'left', glow: .6 });
  if (h.sub) K.text(ctx, h.sub, 121, 190, { font: F.serif(500, 19), color: C.gray, spacing: 2 });
  if (h.en) K.text(ctx, h.en, 1800, 96, { font: `italic ${F.latin(500, 19)}`, color: C.gray, align: 'right', spacing: .5 });
  if (h.zh) {
    K.text(ctx, h.zh, 1780, 156, { font: F.serif(700, 23), color: C.white, align: 'right' });
    ctx.fillStyle = '#C8343A'; ctx.fillRect(1790, 139, 9, 9);
  }
  ctx.restore();
}
const sameHeader = (a, b) => (!a && !b) || (a && b && JSON.stringify(a) === JSON.stringify(b));

/* ---------- scene helper passed to visuals ---------- */
function helper(sc, t) {
  return {
    t, dur: sc.dur,
    beat: i => sc.beats[Math.min(i, sc.beats.length - 1)] ?? 0,
    /** eased progress starting at line i (+delay) over d seconds */
    at: (i, delay = 0, d = .9, ease = easeOut) => ease((t - ((sc.beats[i] ?? 0) + delay)) / d),
    /** linear progress */
    lin: (i, delay = 0, d = 1) => clamp((t - ((sc.beats[i] ?? 0) + delay)) / d),
    /** progress from absolute scene time */
    p: (s, d = .9, ease = easeOut) => ease((t - s) / d),
    after: i => t >= (sc.beats[i] ?? 0),
    line: () => { let k = -1; sc.beats.forEach((b, i) => { if (t >= b) k = i; }); return k; },
  };
}

/* ============================================================
   MOTION SYSTEM
   · every scene has a slow camera (push-in + drift) so nothing is ever static
   · scenes overlap by TR seconds and are composited with a transition
     (zoom-through, parallax push, gold light-sweep, iris) — never a cut to black
   · a single field of gold dust runs under the whole film, reacting to transitions
   ============================================================ */
const TR = FILM.transition ?? 1.1;
const LAYER = [0, 1].map(() => { const c = document.createElement('canvas'); c.width = W * SCALE; c.height = H * SCALE; return c; });

function camera(sc, t) {
  const cam = Object.assign({ z0: 1.0, z1: 1.045, x0: 0, x1: -14, y0: 0, y1: -6 }, sc.camera || {});
  const u = easeInOut(clamp((t + TR / 2) / (sc.dur + TR)));
  return { z: lerp(cam.z0, cam.z1, u), x: lerp(cam.x0, cam.x1, u), y: lerp(cam.y0, cam.y1, u) };
}

function drawScene(c, sc, t) {                       // visual + subtitle of one scene, camera applied to the visual
  c.save();
  const cm = camera(sc, t);
  c.translate(W / 2 + cm.x, H / 2 + cm.y); c.scale(cm.z, cm.z); c.translate(-W / 2, -H / 2);
  if (sc.visual) sc.visual(c, helper(sc, t), K);
  c.restore();
  if (sc.lines.length) {
    const li = helper(sc, t).line();
    if (li >= 0) {
      const start = sc.beats[li], end = li + 1 < sc.lines.length ? sc.beats[li + 1] : sc.dur + TR * .1;
      const st = FILM.subtitle || {};
      K.rich(c, lineText(sc.lines[li]), {
        x: sc.subX ?? st.x ?? 220, y: sc.subY ?? st.y ?? 912, size: st.size || 42, maxW: st.maxW || 1480, align: sc.subAlign || st.align,
        t: t - start, out: (t - (end - .3)) / .3, anchorTop: true,   // 2-line subtitles grow downward, never into the picture
      });
    }
  }
}

function layerOf(i, sc, t) {
  const L = LAYER[i], c = L.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, L.width, L.height);
  c.setTransform(SCALE, 0, 0, SCALE, 0, 0); c.globalAlpha = 1;
  drawScene(c, sc, t);
  return L;
}

function blit(L, o) {                                 // composite a layer with scale / offset / alpha / blur
  if (o.alpha <= 0.002) return;
  ctx.save();
  ctx.globalAlpha = clamp(o.alpha);
  if (o.blur > .3) ctx.filter = `blur(${(o.blur * SCALE).toFixed(1)}px)`;
  const s = o.scale ?? 1, cx = o.cx ?? W / 2, cy = o.cy ?? H / 2;
  if (o.clip) { ctx.beginPath(); o.clip(ctx); ctx.clip(); }          // clip in screen space, before the layer's own motion
  ctx.translate(cx + (o.dx || 0), cy + (o.dy || 0)); ctx.scale(s, s); ctx.translate(-cx, -cy);
  ctx.drawImage(L, 0, 0, W, H);
  ctx.restore();
}

const TRANSITIONS = {
  zoom(A, B, p) {                                     // fly through the old scene into the new one
    const e = easeInOut(p);
    blit(A, { alpha: 1 - easeOut(p * 1.25), scale: lerp(1, 1.16, e), blur: e * 9 });
    blit(B, { alpha: easeOut((p - .2) / .8), scale: lerp(.9, 1, easeOut(p)), blur: (1 - easeOut(p)) * 8 });
    return { dust: e };
  },
  push(A, B, p, dir = 1) {                            // parallax slide with depth blur
    const e = easeInOut(p);
    blit(A, { alpha: 1 - e, dx: -e * 380 * dir, scale: lerp(1, .97, e), blur: e * 7 });
    blit(B, { alpha: e, dx: (1 - e) * 380 * dir, scale: lerp(1.03, 1, e), blur: (1 - e) * 7 });
    return { dust: e, drift: dir };
  },
  sweep(A, B, p) {                                     // a gold light bar wipes the frame
    const e = easeInOut(p), bx = lerp(-260, W + 260, e), sk = 180;
    blit(A, { alpha: 1, clip: c => { c.moveTo(bx, 0); c.lineTo(W + 400, 0); c.lineTo(W + 400, H); c.lineTo(bx - sk, H); c.closePath(); } });
    blit(B, { alpha: 1, clip: c => { c.moveTo(-400, 0); c.lineTo(bx, 0); c.lineTo(bx - sk, H); c.lineTo(-400, H); c.closePath(); } });
    ctx.save();
    const g = ctx.createLinearGradient(bx - 120, 0, bx + 40, 0);
    g.addColorStop(0, rgba(C.gold, 0)); g.addColorStop(.75, rgba(C.goldHi, .5)); g.addColorStop(1, rgba(C.goldHi, 0));
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(bx - 120, 0); ctx.lineTo(bx + 40, 0); ctx.lineTo(bx + 40 - sk, H); ctx.lineTo(bx - 120 - sk, H); ctx.fill();
    ctx.strokeStyle = rgba(C.goldHi, .9 * Math.sin(Math.PI * p)); ctx.lineWidth = 1.5; ctx.shadowColor = C.goldHi; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx - sk, H); ctx.stroke();
    ctx.restore();
    return { dust: e };
  },
  iris(A, B, p, at = [W / 2, H / 2]) {               // the new scene opens from a point, ringed in gold
    const e = easeInOut(p), r = e * Math.hypot(W, H) * .62;
    blit(A, { alpha: 1, scale: lerp(1, 1.06, e), blur: e * 5, clip: c => { c.rect(-W, -H, W * 3, H * 3); c.arc(at[0], at[1], Math.max(r, .1), 0, 6.2832, true); } });
    blit(B, { alpha: 1, clip: c => c.arc(at[0], at[1], Math.max(r, .1), 0, 6.2832) });
    ctx.save(); ctx.strokeStyle = rgba(C.goldHi, .85 * Math.sin(Math.PI * clamp(p))); ctx.lineWidth = 1.6; ctx.shadowColor = C.goldHi; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(at[0], at[1], Math.max(r, .1), 0, 6.2832); ctx.stroke(); ctx.restore();
    return { dust: e };
  },
  dissolve(A, B, p) {
    const e = easeInOut(p);
    blit(A, { alpha: 1 - e, blur: e * 4 }); blit(B, { alpha: e, blur: (1 - e) * 4 });
    return { dust: e * .5 };
  },
};

/* ---------- gold dust: one continuous particle field under the whole film ---------- */
const DUST = (() => { const R = rng(88), a = []; for (let i = 0; i < 420; i++) a.push({ x: R() * W, y: R() * H, z: .2 + R() * .8, r: .35 + R() ** 4 * 2.6, ph: R() * 6.28, sp: .3 + R() * .7 }); return a; })();
function drawDust(time, kick) {                       // kick: 0..1 transition energy → particles stream
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const d of DUST) {
    const vx = 6 * d.z * d.sp, vy = -3.5 * d.z * d.sp;
    let x = (d.x + time * vx + Math.sin(time * .3 + d.ph) * 18 * d.z + kick * 220 * d.z) % W; if (x < 0) x += W;
    let y = (d.y + time * vy + Math.cos(time * .23 + d.ph) * 12 * d.z) % H; if (y < 0) y += H;
    const tw = .55 + .45 * Math.sin(time * (1.1 + d.sp) + d.ph);
    const a = (.22 + .3 * d.z) * tw;
    ctx.fillStyle = rgba(C.goldHi, a);
    if (kick > .02 && d.z > .7) {                     // faint motion trails on the nearest motes during transitions
      const g = ctx.createLinearGradient(x, 0, x - kick * 70 * d.z, 0);
      g.addColorStop(0, rgba(C.goldHi, a * .5)); g.addColorStop(1, rgba(C.goldHi, 0));
      ctx.strokeStyle = g; ctx.lineWidth = d.r * d.z;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - kick * 70 * d.z, y); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y, d.r * d.z + .3, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
   seek(frame) — the only entry point the renderer calls
   ============================================================ */
window.seek = function seek(frame) {
  const f = Math.max(0, Math.min(TOTAL - 1, Math.round(frame)));
  const time = f / FPS;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.filter = 'none';
  ctx.drawImage(BG, 0, 0, W, H);
  drawAtmosphere(time);

  let k = SC.findIndex(s => time >= s.start && time < s.end); if (k < 0) k = SC.length - 1;
  const sc = SC[k];
  // inside a transition window? (centred on each scene boundary)
  let A = null, B = null, p = 0;
  if (k > 0 && time < sc.start + TR / 2) { A = SC[k - 1]; B = sc; }
  else if (k < SC.length - 1 && time >= sc.end - TR / 2) { A = sc; B = SC[k + 1]; }
  if (A) p = clamp((time - (B.start - TR / 2)) / TR);

  let kick = 0;
  if (A) {
    const LA = layerOf(0, A, time - A.start), LB = layerOf(1, B, time - B.start);
    const tr = B.tr || 'zoom', [kind, arg] = Array.isArray(tr) ? tr : [tr];
    const r = TRANSITIONS[kind](LA, LB, p, arg) || {};
    kick = Math.sin(Math.PI * p) * (r.dust ?? 0);
  } else {
    drawScene(ctx, sc, time - sc.start);
  }
  drawDust(time, kick);

  // header: persists when unchanged, otherwise the old one lifts away as the new one settles
  if (A && !sameHeader(A.header, B.header)) {
    const e = easeInOut(p);
    drawHeader(A.header, 1 - clamp(e * 2.2), -14 * e);            // old header is fully gone before the new one appears: text never overlaps
    drawHeader(B.header, clamp((e - .5) * 2.2), 14 * (1 - e));
  } else drawHeader(sc.header, 1);

  // film in / out
  const fin = clamp(time / 1.0), fout = clamp((T - time) / 1.4), fade = Math.min(fin, fout);
  if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
  const wm = (A ? (A.noWatermark && B.noWatermark) : sc.noWatermark) ? 0 : 1;
  if (wm) drawWatermark(ctx, 120, 34, 26, .88 * Math.min(1, clamp((time - .6) / .8)));
  return f;
};

window.ASSETS_READY = Promise.all([...document.images].map(i => i.decode().catch(() => null))).then(() => document.fonts.ready).then(() => Promise.all(['SerifSC', 'LatinSerif', 'MonoL', 'BrandSans'].flatMap(fam => [
  document.fonts.load(`500 20px ${fam}`, 'K线Ab1'), document.fonts.load(`700 20px ${fam}`, 'K线Ab1'), document.fonts.load(`900 20px ${fam}`, 'K线Ab1'), document.fonts.load(`600 20px ${fam}`, 'Ab'), document.fonts.load(`300 20px ${fam}`, '1'),
]))).then(() => window.seek(0));

(function preview() {                              // ?t=12.5 to inspect a moment; ?play to watch in real time
  const q = new URLSearchParams(location.search);
  window.ASSETS_READY.then(() => {
    if (q.has('t')) window.seek(+q.get('t') * FPS);
    if (q.has('play')) { const t0 = performance.now() - (+q.get('play') || 0) * 1000; const tick = () => { window.seek((performance.now() - t0) / 1000 * FPS); requestAnimationFrame(tick); }; tick(); }
  });
})();
</script>
