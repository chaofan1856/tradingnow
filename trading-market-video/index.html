<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>认识交易市场</title>
<style>
@font-face { font-family: NSC; src: url(fonts/noto-sans-sc-chinese-simplified-300-normal.woff2) format('woff2'); font-weight: 300; }
@font-face { font-family: NSC; src: url(fonts/noto-sans-sc-chinese-simplified-500-normal.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: NSC; src: url(fonts/noto-sans-sc-chinese-simplified-900-normal.woff2) format('woff2'); font-weight: 900; }
@font-face { font-family: InterD; src: url(fonts/InterDisplay-Light.otf) format('opentype'); font-weight: 300; }
@font-face { font-family: InterD; src: url(fonts/InterDisplay-SemiBold.otf) format('opentype'); font-weight: 600; }
html, body { margin: 0; background: #05060A; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ======================================================================
   《认识交易市场》 —— 逐帧确定性动效工程（横版 1920×1080）
   window.seek(frame) 同一帧永远同一画面：无 CSS 动画 / 无 Date.now() / 无 Math.random()
   ====================================================================== */

/* ---------------- 可调参数 ---------------- */
const CANVAS        = { W: 1920, H: 1080 };   // 横版（B 站 / 视频号）。竖版 1080×1920 的版本见提交 51545bb
const FPS           = 30;
const TOTAL_FRAMES  = 2340;                   // 78 秒 —— 目标时长，不要压缩
const HOOK_FRAMES   = 90;                     // 黄金三秒：第 90 帧标题 + 钩子全部到位（不建议超过 105）
const BLACKOUT_AT   = [810, 1560];            // 允许的两次黑场（各 ±2 帧收黑）
const GOLD_LEVEL    = 0.7;                    // 金色克制系数：0=不用金，1=放宽
const STARFIELD     = true;                   // 深空星尘层
const GRAIN_OPACITY = 0.05;                   // 颗粒噪点，0=干净
const BLOOM         = 0.42;                   // 胶片式柔光（只吃亮部），0=关闭
const VIGNETTE      = 0.38;                   // 暗角强度
const SAFE          = { L: 120, R: 120, T: 90, B: 140 };
const READY_FRAMES  = 420;                    // 当前已制作到的帧（0:00–0:14）

/* ---------------- 音效提示表（tools/sound.mjs 直接读取这段 JSON） ---------------- */
const CUES = /*CUES*/[
  { "f": 18,  "s": "dust",   "g": 0.75, "pan": 0.35 },
  { "f": 46,  "s": "dust",   "g": 0.45 },
  { "f": 58,  "s": "whoosh", "g": 0.35, "rev": true },
  { "f": 70,  "s": "whoosh", "g": 1.0 },
  { "f": 72,  "s": "dust",   "g": 0.55 },
  { "f": 112, "s": "dust",   "g": 0.40 },
  { "f": 124, "s": "whoosh", "g": 0.30 },
  { "f": 148, "s": "quote",  "g": 0.45 },
  { "f": 198, "s": "quote",  "g": 0.40, "pan": -0.3 },
  { "f": 200, "s": "quote",  "g": 0.40, "pan": 0.3 },
  { "f": 205, "s": "quote",  "g": 0.40, "pan": -0.3 },
  { "f": 211, "s": "quote",  "g": 0.40, "pan": -0.3 },
  { "f": 214, "s": "quote",  "g": 0.45, "pan": 0.3 },
  { "f": 217, "s": "quote",  "g": 0.50, "pan": -0.3 },
  { "f": 232, "s": "snap",   "g": 1.0 },
  { "f": 233, "s": "whoosh", "g": 0.55 },
  { "f": 246, "s": "quote",  "g": 0.30 },
  { "f": 252, "s": "quote",  "g": 0.30 },
  { "f": 260, "s": "quote",  "g": 0.35 },
  { "f": 318, "s": "dust",   "g": 0.55, "pan": -0.3 },
  { "f": 352, "s": "whoosh", "g": 0.28 },
  { "f": 392, "s": "coin",   "g": 0.9,  "pan": -0.4 },
  { "f": 400, "s": "snap",   "g": 0.35, "pan": 0.4 },
  { "f": 404, "s": "whoosh", "g": 0.45, "pan": 0.5 }
]/*END*/;

/* ---------------- 色板 ---------------- */
const COL = {
  bg: '#05060A', glow: '#141008', dust: '#6A6A78',
  gold: '#C8A96A', goldHi: '#E8C87A', goldTop: '#F2E0B0',
  white: '#EAEAEA', gray: '#8A8A82',
  red: '#C9424A', green: '#2A8A62', teal: '#3E8A9C',
};

/* ---------------- 缓动曲线库（全片只用这四条） ---------------- */
function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = s => ((ax * s + bx) * s + cx) * s, Y = s => ((ay * s + by) * s + cy) * s;
  const D = s => (3 * ax * s + 2 * bx) * s + cx;
  return t => {
    if (t <= 0) return 0; if (t >= 1) return 1;
    let s = t;
    for (let i = 0; i < 8; i++) {
      const e = X(s) - t; if (Math.abs(e) < 1e-7) return Y(s);
      const d = D(s); if (Math.abs(d) < 1e-6) break;
      s -= e / d; if (s < 0 || s > 1) break;
    }
    let lo = 0, hi = 1; s = t;
    for (let i = 0; i < 40; i++) { const x = X(s); if (Math.abs(x - t) < 1e-7) break; if (x < t) lo = s; else hi = s; s = (lo + hi) / 2; }
    return Y(s);
  };
}
const EXPO_OUT = cubicBezier(.16, 1, .30, 1);
const EXPO_IN  = cubicBezier(.70, 0, .84, 0);
const SNAP     = cubicBezier(.34, 1.56, .64, 1);
const LINEAR   = t => Math.min(1, Math.max(0, t));
/* 组合：前半 EXPO_IN 起步、后半 EXPO_OUT 停稳（仍只用库内曲线） */
const EXPO_INOUT = t => t < 0.5 ? EXPO_IN(t * 2) / 2 : 0.5 + EXPO_OUT(t * 2 - 1) / 2;

/* ---------------- 工具 ---------------- */
const W = CANVAS.W, H = CANVAS.H, CX = W / 2, CY = H / 2, TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const anim = (f, start, dur, ease = LINEAR) => ease(clamp((f - start) / dur));
const fract = x => x - Math.floor(x);
const hash = i => fract(Math.sin(i * 12.9898 + 78.233) * 43758.5453);     // 确定性伪随机
const mod = (a, n) => ((a % n) + n) % n;
const qb = (p0, p1, p2, t) => ({ x: (1 - t) ** 2 * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x,
                                y: (1 - t) ** 2 * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y });
const cb = (p, t) => { const u = 1 - t; return {
  x: u * u * u * p[0].x + 3 * u * u * t * p[1].x + 3 * u * t * t * p[2].x + t * t * t * p[3].x,
  y: u * u * u * p[0].y + 3 * u * u * t * p[1].y + 3 * u * t * t * p[2].y + t * t * t * p[3].y }; };
function hexRGB(h) { if (Array.isArray(h)) return h; const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixHex(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return A.map((v, i) => Math.round(lerp(v, B[i], t))); }
function rgba(c, a) { const [r, g, b] = hexRGB(c); return `rgba(${r},${g},${b},${clamp(a)})`; }
/* 金色统一出口：GOLD_LEVEL 越低越向冷白退、越淡 */
const GK = clamp(GOLD_LEVEL / 0.7, 0, 1.4);
function gold(hex, a) { return rgba(mixHex(COL.white, hex, Math.min(1, GK)), a * Math.min(1.15, 0.35 + 0.65 * GK)); }

/* ---------------- 画布 ---------------- */
const mainCanvas = document.getElementById('c');
mainCanvas.width = W; mainCanvas.height = H; mainCanvas.style.width = W + 'px'; mainCanvas.style.height = H + 'px';
const out = mainCanvas.getContext('2d');
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
const [sceneC, ctx] = mk();          // 场景合成层（引力透镜在它之上做径向扭曲）
const [tmpC, tctx]  = mk();          // 运动模糊累积层
const [bgC, bctx]   = mk();          // 景深层（背景 / 中景，统一模糊 + 降对比）
const [bl1C, bl1]   = mk(W / 4, H / 4);   // 柔光：亮部提取
const [bl2C, bl2]   = mk(W / 4, H / 4);   // 柔光：模糊

/* ---------------- 虚拟摄像机 ---------------- */
function camera(f) {
  let z = 1
    + 0.03 * anim(f, 18, 30, EXPO_OUT)       // 光丝启动，轻推
    - 0.03 * anim(f, 70, 18, EXPO_OUT)       // 爆开，被冲击推远
    + 0.08 * anim(f, 90, 66, EXPO_OUT)       // 长时间曝光式推近（2.2s）——穿过奇点进入 S1
    + 0.02 * anim(f, 156, 150, LINEAR)       // S1 缓慢推轨
    - 0.07 * anim(f, 306, 48, EXPO_OUT)      // 两卡收成小台，拉远露出桥（1.6s）
    + 0.012 * anim(f, 354, 66, LINEAR);
  let x = (f > 18 ? 4 * Math.sin((f - 18) / 55) : 0) + 70 * anim(f, 398, 30, EXPO_IN);  // 结尾向右横移，接 S2
  let y = f > 18 ? 2 * Math.sin((f - 18) / 80) : 0;
  return { x, y, z };
}
/* 三层视差 1 : 0.55 : 0.28 */
function applyCam(c, cam, k) {
  const z = 1 + (cam.z - 1) * k;
  c.translate(CX, CY); c.scale(z, z); c.translate(-CX - cam.x * k, -CY - cam.y * k);
}

/* ---------------- 运动模糊：沿速度方向多重采样（lighter 累加 = 精确平均） ---------------- */
function motionBlur(c, vx, vy, draw) {
  const sp = Math.hypot(vx, vy) * FPS;           // px/s
  if (sp <= 900) { draw(c); return; }
  const len = lerp(6, 18, clamp((sp - 900) / 2600));
  const ux = vx / Math.hypot(vx, vy), uy = vy / Math.hypot(vx, vy);
  const n = 10;
  tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, W, H);
  tctx.setTransform(c.getTransform());
  tctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const o = -len * i / (n - 1);
    tctx.save(); tctx.globalAlpha = 1 / n; tctx.translate(ux * o, uy * o); draw(tctx); tctx.restore();
  }
  tctx.globalCompositeOperation = 'source-over';
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(tmpC, 0, 0); c.restore();
}

/* ---------------- 绘图小件 ---------------- */
function glowDot(c, x, y, r, col, a, gr, core) {
  const g = c.createRadialGradient(x, y, 0, x, y, gr);
  g.addColorStop(0, rgba(col, a * 0.55)); g.addColorStop(0.22, rgba(col, a * 0.2)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, gr, 0, TAU); c.fill();
  c.fillStyle = rgba(core || col, a); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
function goldDot(c, x, y, r, a, gr) {
  const g = c.createRadialGradient(x, y, 0, x, y, gr);
  g.addColorStop(0, gold(COL.goldHi, a * 0.5)); g.addColorStop(0.25, gold(COL.gold, a * 0.16)); g.addColorStop(1, gold(COL.gold, 0));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, gr, 0, TAU); c.fill();
  c.fillStyle = gold(COL.goldTop, a); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
/* 等宽数字：每位数字固定格宽，滚动永不抖动（等效 tabular-nums） */
function tabular(c, str, x, y, size, align, weight = 300) {
  c.font = `${weight} ${size}px InterD`;
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  const cell = ch => /[0-9]/.test(ch) ? size * 0.62 : (ch === '.' || ch === ',') ? size * 0.3 : c.measureText(ch).width + size * 0.06;
  const total = [...str].reduce((s, ch) => s + cell(ch), 0);
  let x0 = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
  for (const ch of str) { const w = cell(ch); c.fillText(ch, x0 + w / 2, y); x0 += w; }
  return total;
}
function text(c, s, x, y, font, fill, align = 'left', spacing = '0.02em') {
  c.font = font; c.fillStyle = fill; c.textAlign = align; c.textBaseline = 'alphabetic'; c.letterSpacing = spacing;
  c.fillText(s, x, y); c.letterSpacing = '0px';
}
/* 货物：等轴测箱子（实线、有体积） */
function drawBox(c, x, y, s, a, dashed = false) {
  const h = s * 0.5;
  const top = [[x, y - s], [x + s, y - s + h], [x, y - s + 2 * h], [x - s, y - s + h]];
  const poly = (pts, fill) => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); c.fillStyle = fill; c.fill(); c.stroke(); };
  c.save(); c.lineWidth = 1.6; c.lineJoin = 'round'; c.strokeStyle = rgba(COL.white, 0.9 * a);
  if (dashed) c.setLineDash([6, 6]);
  poly(top, rgba(COL.white, 0.12 * a));
  poly([[x - s, y - s + h], [x, y - s + 2 * h], [x, y + s * 0.5 + h], [x - s, y + s * 0.5]], rgba(COL.white, 0.05 * a));
  poly([[x + s, y - s + h], [x, y - s + 2 * h], [x, y + s * 0.5 + h], [x + s, y + s * 0.5]], rgba(COL.white, 0.02 * a));
  c.restore();
}
function drawCoin(c, x, y, r, a, sx = 1, sy = 1) {
  c.save(); c.translate(x, y); c.scale(sx, sy);
  c.lineWidth = 1.6; c.strokeStyle = rgba(COL.white, 0.9 * a); c.fillStyle = rgba(COL.white, 0.05 * a);
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill(); c.stroke();
  c.lineWidth = 1; c.strokeStyle = rgba(COL.white, 0.3 * a); c.beginPath(); c.arc(0, 0, r * 0.76, 0, TAU); c.stroke();
  c.fillStyle = rgba(COL.white, 0.9 * a); c.font = `300 ${r * 0.95}px InterD`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('¥', 0, r * 0.04);
  c.restore();
}

/* ======================================================================
   底层：深空黑 + 暖金径向晕 + 深空星尘（全片不停，4px/s 横向漂移）
   ====================================================================== */
const STARS = Array.from({ length: 360 }, (_, i) => ({
  x: hash(i * 3.17 + 0.5) * (W + 80), y: hash(i * 7.73 + 1.1) * H,
  r: 0.45 + hash(i * 1.31 + 2.2) ** 2 * 1.5, a: 0.06 + hash(i * 5.11 + 3.3) * 0.04,
  sp: [4, 2.6, 1.6][i % 3], tw: hash(i * 9.7 + 4.4) * TAU,
}));
const MOTES = Array.from({ length: 24 }, (_, i) => ({
  x: hash(i * 13.1 + 7) * (W + 200), y: hash(i * 17.3 + 9) * H, r: 6 + hash(i * 3.9 + 1) * 16, a: 0.03 + hash(i * 2.3) * 0.03,
}));
function drawBackground(f, cam) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#030408'; ctx.fillRect(0, 0, W, H);       // 颗粒层叠加后平均回到 #05060A
  const g = ctx.createRadialGradient(CX, CY - 40, 0, CX, CY - 40, W * 0.62);
  g.addColorStop(0, rgba(COL.glow, 0.22)); g.addColorStop(0.45, rgba(COL.glow, 0.12)); g.addColorStop(1, rgba(COL.glow, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!STARFIELD) return;
  /* 背景层（k=0.28）：先画到景深层，再整体 blur + 降对比 */
  bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.clearRect(0, 0, W, H);
  bctx.save(); applyCam(bctx, cam, 0.28);
  const span = W + 80;
  for (const s of STARS) {
    const x = mod(s.x - f * s.sp / FPS, span) - 40;
    const a = s.a * (0.8 + 0.2 * Math.sin(f * 0.05 + s.tw));
    bctx.fillStyle = rgba(COL.dust, a * 2.2); bctx.beginPath(); bctx.arc(x, s.y, s.r, 0, TAU); bctx.fill();
  }
  for (const m of MOTES) {
    const x = mod(m.x - f * 3 / FPS, W + 200) - 100;
    const gg = bctx.createRadialGradient(x, m.y, 0, x, m.y, m.r);
    gg.addColorStop(0, rgba(COL.dust, m.a)); gg.addColorStop(1, rgba(COL.dust, 0));
    bctx.fillStyle = gg; bctx.beginPath(); bctx.arc(x, m.y, m.r, 0, TAU); bctx.fill();
  }
  bctx.restore();
  ctx.save(); ctx.filter = 'blur(1.5px) contrast(0.75)'; ctx.globalAlpha = 0.45; ctx.drawImage(bgC, 0, 0); ctx.restore();
}
/* 中景：极淡结构网格（k=0.55），主元素运动时做 6% 呼吸位移（次要动作） */
function activity(f) {
  const bump = (a, b) => f < a || f > b ? 0 : Math.sin(Math.PI * (f - a) / (b - a)) ** 2;
  return Math.max(bump(122, 156), bump(220, 266), bump(306, 344), bump(350, 400), bump(402, 430));
}
function drawGrid(f, cam) {
  const a = 0.028 * anim(f, 118, 40, EXPO_OUT);
  if (a <= 0.001) return;
  const br = 1 + 0.06 * activity(f), sp = 120;
  bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.clearRect(0, 0, W, H);
  bctx.save(); applyCam(bctx, cam, 0.55);
  bctx.translate(CX, CY); bctx.scale(br, br); bctx.translate(-CX + 0.06 * sp * activity(f), -CY);
  bctx.strokeStyle = rgba(COL.white, 1); bctx.lineWidth = 1;
  bctx.beginPath();
  for (let x = CX - sp * 10; x <= CX + sp * 10; x += sp) { bctx.moveTo(x, -200); bctx.lineTo(x, H + 200); }
  for (let y = CY - sp * 6; y <= CY + sp * 6; y += sp) { bctx.moveTo(-200, y); bctx.lineTo(W + 200, y); }
  bctx.stroke();
  bctx.restore();
  /* 中心亮、四周暗：网格只在画面中部若隐若现 */
  bctx.globalCompositeOperation = 'destination-in';
  const m = bctx.createRadialGradient(CX, CY, 80, CX, CY, 820);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  bctx.fillStyle = m; bctx.fillRect(0, 0, W, H); bctx.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'blur(2.5px) contrast(0.75)'; ctx.globalAlpha = a; ctx.drawImage(bgC, 0, 0); ctx.restore();
}

/* ======================================================================
   S0 · 0–120 · 黄金三秒：静 → 动 → 爆 → 亮字
   ====================================================================== */
const STAR = { x: 1440, y: 280 };
const FIL = [STAR, { x: 1740, y: 560 }, { x: 1340, y: 880 }, { x: CX, y: CY }];
const RP = { x: 1250, y: 430 }, GP = { x: 670, y: 650 };   // 红（买）在右、绿（卖）在左 —— 与 S1 买卖两侧一致
const RING_R = 430;
function pointPos(f, which) {         // 两个光点：先分开（预备），再弧线相向砸入
  const P = which === 'r' ? RP : GP, s = which === 'r' ? 1 : -1;
  if (f < 58) return qb({ x: CX, y: CY }, { x: CX + 200 * s, y: CY + 80 * s }, P, anim(f, 46, 12, EXPO_OUT));
  return qb(P, { x: CX + 60 * s, y: CY + 240 * s }, { x: CX, y: CY }, anim(f, 58, 12, EXPO_IN));
}
function ringRadius(f) {
  const rs = 36 + (RING_R - 36) * SNAP(clamp((f - 70) / 20));   // 爆开，SNAP 微过冲
  return rs - (rs - 4) * anim(f, 88, 32, EXPO_IN);               // 长时间曝光式收缩，坍缩成奇点
}
function drawS0(c, f) {
  /* —— 第一拍【静】0–18：一颗极远金色星点 —— */
  if (f < 18) {
    const tw = 0.85 + 0.15 * Math.sin(f * 0.35);
    goldDot(c, STAR.x, STAR.y, 1.5, 0.5 * tw, 26);
    c.fillStyle = gold(COL.gold, 0.08); c.beginPath(); c.arc(STAR.x, STAR.y, 46, 0, TAU); c.fill();
  }
  /* —— 第二拍【动】18–48：被引力拉成光丝，弧线弯向中心，尾端跟随 —— */
  if (f >= 18 && f < 50) {
    const uh = anim(f, 18, 24, EXPO_OUT), ut = anim(f, 23, 25, EXPO_OUT);
    const fade = 1 - anim(f, 44, 5, LINEAR);
    const bright = lerp(0.55, 1, anim(f, 18, 10, EXPO_OUT)) * fade;
    const h0 = cb(FIL, uh), h1 = cb(FIL, anim(f - 1, 18, 24, EXPO_OUT));
    const pts = []; const N = 48;

function drawTransfer(c, f) {
  if (f >= 316 && f < 342) {                 // 火花飞行
    const p = sparkPos(f), q = sparkPos(f - 1);
    const a = 1 - anim(f, 336, 6, EXPO_IN);
    motionBlur(c, p.x - q.x, p.y - q.y, cc => goldDot(cc, p.x, p.y, 4.5, a, 32));
  }
  if (f >= 334 && f < 420) {                 // 货物：火花原地展开成箱子
    const sIn = anim(f, 334, 14, SNAP);
    const p = boxPos(f), q = boxPos(f - 1);
    let sx = 1, sy = 1;
    if (f >= 402 && f < 412) { sy = f < 404 ? lerp(1, 0.96, anim(f, 402, 2)) : lerp(0.96, 1, anim(f, 404, 8, SNAP)); sx = 1 / Math.sqrt(sy); }
    motionBlur(c, p.x - q.x, p.y - q.y, cc => {
      cc.save(); cc.translate(p.x, p.y + 30); cc.scale(sIn * sx, sIn * sy); cc.translate(-p.x, -p.y - 30);
      drawBox(cc, p.x, p.y, 30, 1); cc.restore();
    });
  }
  if (f >= 330) {                            // 硬币：从买方沿上弧线到卖方
    const sIn = anim(f, 330, 16, SNAP);
    const p = coinPos(f), q = coinPos(f - 1);
    let sx = 1, sy = 1;
    if (f >= 392 && f < 404) { sy = f < 394 ? lerp(1, 0.96, anim(f, 392, 2)) : lerp(0.96, 1, anim(f, 394, 9, SNAP)); sx = 1 / Math.sqrt(sy); }
    motionBlur(c, p.x - q.x, p.y - q.y, cc => drawCoin(cc, p.x, p.y, 28 * sIn, 1, sx, sy));
  }
}

/* ======================================================================
   字幕：按 shot 区间显示；按标点自动断行；永不进入安全区（横版：下三分之一）
   ====================================================================== */
const CAPTIONS = [
  [132, 208, '有人想买，有人想卖'],
  [214, 306, '价格达成一致的那一刻，成交'],
  [318, 416, '一手交钱，一手交货'],
];
const CAP = { size: 46, y: 900, lh: 1.15, maxChars: 16, spacing: '0.12em' };
function wrapCaption(c, s) {
  c.font = `300 ${CAP.size}px NSC`; c.letterSpacing = CAP.spacing;
  const maxW = W - SAFE.L - SAFE.R;
  const fits = t => c.measureText(t).width <= maxW;
  if (fits(s) && [...s].length <= CAP.maxChars) { c.letterSpacing = '0px'; return [s]; }
  const parts = s.match(/[^，。、；：！？,;!?]+[，。、；：！？,;!?]?/g) || [s];
  const lines = []; let cur = '';
  for (const p of parts) {
    const cand = cur + p;
    if (cur && (!fits(cand) || [...cand].length > CAP.maxChars)) { lines.push(cur); cur = p; } else cur = cand;
  }
  if (cur) lines.push(cur);
  const res = [];
  for (let l of lines.map(l => l.replace(/[，、,]$/, ''))) {           // 行尾逗号去掉，句读交给换行
    while (!fits(l)) { let i = l.length; while (i > 1 && !fits(l.slice(0, i))) i--; res.push(l.slice(0, i)); l = l.slice(i); }
    res.push(l);
  }
  c.letterSpacing = '0px';
  return res;
}
function drawCaptions(c, f) {
  for (const [a, b, s] of CAPTIONS) {
    if (f < a || f > b) continue;
    const lines = wrapCaption(c, s);
    const lh = CAP.size * CAP.lh * 1.2;
    let y0 = CAP.y - (lines.length - 1) * lh;
    y0 = clamp(y0, SAFE.T + CAP.size, H - SAFE.B - (lines.length - 1) * lh - CAP.size / 2);
    c.save(); c.font = `300 ${CAP.size}px NSC`; c.letterSpacing = CAP.spacing; c.textBaseline = 'middle'; c.textAlign = 'left';
    let idx = 0; const nAll = lines.reduce((s2, l) => s2 + [...l].length, 0);
    lines.forEach((line, li) => {
      const chars = [...line];
      const ws = chars.map(ch => c.measureText(ch).width);
      let x = CX - ws.reduce((p, v) => p + v, 0) / 2;
      chars.forEach((ch, i) => {
        const tin = anim(f, a + idx * 1.8, 16, EXPO_OUT);
        const tout = anim(f, b - 11 - (nAll - 1) * 0.6 + idx * 0.6, 10, EXPO_IN);
        const al = tin * (1 - tout);
        if (al > 0.003) {
          const bl = 6 * (1 - tin) + 6 * tout;
          c.globalAlpha = al; c.filter = bl > 0.05 ? `blur(${bl}px)` : 'none';
          c.fillStyle = COL.white;
          c.fillText(ch, x, y0 + li * lh + 18 * (1 - tin) - 14 * tout);
        }
        x += ws[i]; idx++;
      });
    });
    c.restore();
  }
}

/* ======================================================================
   UI：底部进度刻度（全片唯一 UI 层）+ 章节眉题 +「示意」角标
   ====================================================================== */
const SECTION_ENDS = [120, 420, 810, 1560, 2130, 2340];
const CHAPTERS = [[136, 416, '01', '什么是交易']];
function drawUI(c, f) {
  const a = 0.22 * anim(f, 96, 24, EXPO_OUT);
  if (a > 0.002) {
    const y = H - 44, x0 = SAFE.L, x1 = W - SAFE.R, p = f / TOTAL_FRAMES;
    c.save();
    c.fillStyle = rgba(COL.white, a * 0.35); c.fillRect(x0, y - 1, x1 - x0, 2);
    c.fillStyle = rgba(COL.white, a); c.fillRect(x0, y - 1.5, (x1 - x0) * p, 3);
    for (const e of SECTION_ENDS) {
      const xx = lerp(x0, x1, e / TOTAL_FRAMES), lit = f >= e;
      c.fillStyle = rgba(COL.white, lit ? a * 1.4 : a * 0.6); c.fillRect(xx - 1, y - 6, 2, 12);
    }
    c.restore();
  }
  for (const [s, e, no, name] of CHAPTERS) {
    if (f < s || f > e) continue;
    const ai = anim(f, s, 20, EXPO_OUT), ao = anim(f, e - 10, 10, EXPO_IN), al = ai * (1 - ao);
    c.save(); c.globalAlpha = al * 0.9;
    text(c, no, SAFE.L, SAFE.T + 26 - 8 * (1 - ai), '300 22px InterD', COL.white, 'left', '0.2em');
    c.fillStyle = rgba(COL.white, 0.25); c.fillRect(SAFE.L + 44, SAFE.T + 18 - 8 * (1 - ai), 36 * ai, 1);
    c.globalAlpha = anim(f, s + 2.4, 20, EXPO_OUT) * (1 - ao) * 0.9;
    text(c, name, SAFE.L + 96, SAFE.T + 26 - 8 * (1 - ai), '300 22px NSC', COL.gray, 'left', '0.3em');
    c.restore();
  }
  const ta = 0.75 * anim(f, 140, 18, EXPO_OUT);
  if (ta > 0.002) { c.save(); c.globalAlpha = ta; text(c, '示意', W - SAFE.R, SAFE.T + 26, '300 22px NSC', COL.gray, 'right', '0.3em'); c.restore(); }
}

/* ---------------- 颗粒噪点（确定性：mulberry32 种子，按 frame 选片 + 偏移） ---------------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const GRAIN = [1, 2, 3].map(seed => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const img = g.createImageData(256, 256), rnd = mulberry32(seed * 7919);
  for (let i = 0; i < img.data.length; i += 4) { const v = rnd() * 96; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return c;
});

/* ---------------- 合成：引力透镜（仅帧 70–78）→ 柔光 → 暗角 ---------------- */
function composite(f) {
  out.setTransform(1, 0, 0, 1, 0, 0);
  out.drawImage(sceneC, 0, 0);
  if (f >= 70 && f <= 78) {                  // 整屏径向扭曲 2–3%，向外扩散，80ms 恢复（全片只此一次）
    const R = 1200 * anim(f, 70, 6, EXPO_OUT);
    const A = 0.028 * (1 - anim(f, 75.6, 2.4, EXPO_OUT));
    const N = 64, maxR = Math.hypot(CX, CY) + 20;
    for (let i = 0; i < N; i++) {
      const r0 = i * maxR / N, r1 = (i + 1) * maxR / N, rm = (r0 + r1) / 2;
      const s = 1 + A * Math.exp(-(((rm - R) / 190) ** 2));
      if (s - 1 < 2e-4) continue;
      out.save(); out.beginPath(); out.arc(CX, CY, r1, 0, TAU); out.arc(CX, CY, r0, 0, TAU, true); out.clip();
      out.translate(CX, CY); out.scale(s, s); out.translate(-CX, -CY); out.drawImage(sceneC, 0, 0); out.restore();
    }
  }
  if (BLOOM > 0) {                           // 胶片式柔光：1/4 尺寸提取亮部 → 模糊 → screen 叠回
    bl1.setTransform(1, 0, 0, 1, 0, 0); bl1.clearRect(0, 0, W / 4, H / 4);
    bl1.filter = 'brightness(0.85) contrast(2.6)'; bl1.drawImage(mainCanvas, 0, 0, W / 4, H / 4); bl1.filter = 'none';
    bl2.clearRect(0, 0, W / 4, H / 4); bl2.filter = 'blur(6px)'; bl2.drawImage(bl1C, 0, 0); bl2.filter = 'none';
    out.save(); out.globalCompositeOperation = 'screen'; out.globalAlpha = BLOOM; out.imageSmoothingQuality = 'high';
    out.drawImage(bl2C, 0, 0, W, H); out.restore();
  }
  if (VIGNETTE > 0) {
    const v = out.createRadialGradient(CX, CY, H * 0.45, CX, CY, Math.hypot(CX, CY));
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${VIGNETTE})`);
    out.fillStyle = v; out.fillRect(0, 0, W, H);
  }
}

/* ======================================================================
   seek(frame)
   ====================================================================== */
function seek(frame) {
  const f = Math.max(0, Math.min(TOTAL_FRAMES - 1, Math.round(frame)));
  const cam = camera(f);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  drawBackground(f, cam);
  drawGrid(f, cam);
  /* 前景主层（k=1） */
  ctx.save(); applyCam(ctx, cam, 1);
  if (f < READY_FRAMES) {
    drawS0(ctx, f);
    drawCenterline(ctx, f);
    drawEmber(ctx, f);
    drawCard(ctx, f, 'sell'); drawCard(ctx, f, 'buy');
    drawDeal(ctx, f);
    drawBridge(ctx, f);
    drawTransfer(ctx, f);
  }
  ctx.restore();
  /* 屏幕空间：标题 / 字幕 */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (f < READY_FRAMES) { drawTitle(ctx, f); drawCaptions(ctx, f); }
  else text(ctx, `S2 起制作中（预览已完成 0–${READY_FRAMES - 1} 帧）`, CX, CY, '300 32px NSC', COL.gray, 'center');
  composite(f);
  /* 颗粒 + UI（不参与透镜扭曲） */
  if (GRAIN_OPACITY > 0) {
    const pat = out.createPattern(GRAIN[f % 3], 'repeat');
    out.save(); out.globalAlpha = GRAIN_OPACITY; out.translate(-((f * 37) % 256), -((f * 91) % 256));
    out.fillStyle = pat; out.fillRect(0, 0, W + 256, H + 256); out.restore();
  }
  drawUI(out, f);
  window.__frame = f;
  return f;
}

window.CANVAS = CANVAS;
window.TOTAL_FRAMES = TOTAL_FRAMES;
window.READY_FRAMES = READY_FRAMES;
window.FPS = FPS;
window.CUES = CUES;
window.seek = seek;
window.ASSETS_READY = Promise.all([
  document.fonts.load('300 48px NSC', '认识'), document.fonts.load('500 48px NSC', '认识'),
  document.fonts.load('300 48px InterD', '0123'), document.fonts.load('600 48px InterD', '0123'),
]).then(() => document.fonts.ready).then(() => { seek(0); });
</script>
